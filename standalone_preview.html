i:"अधिकतम ऊंचाई H = (u² sin²θ) / (2g)। यहाँ u = 20 m/s, θ = 45°, और g = 10 m/s²। अतः H = (400 × 0.5) / 20 = 10 मीटर।",timeEstimate:"42s"},{id:2,section:"Section A - Science",topic:"Light & Optics (Class 10)",classLevel:"Class 10",question:"A convex lens has a focal length of 20 cm. At what distance from the lens should an object be placed to form a real, inverted image of the same size?",questionHi:"एक उत्तल लेंस की फोकस दूरी 20 सेमी है। लेंस से कितनी दूरी पर वस्तु को रखा जाए ताकि उसी आकार का वास्तविक एवं उल्टा प्रतिबिंब बने?",options:[{id:"A",text:"10 cm",textHi:"10 सेमी"},{id:"B",text:"20 cm",textHi:"20 सेमी"},{id:"C",text:"40 cm (at 2F)",textHi:"40 सेमी (2F पर)"},{id:"D",text:"60 cm",textHi:"60 सेमी"}],correctAnswer:"C",marks:4,negativeMarks:0,explanation:"For a convex lens, when an object is placed at 2F (twice the focal length = 2 × 20 cm = 40 cm), the image formed is real, inverted, and of the exact same size as the object.",explanationHi:"उत्तल लेंस के लिए जब वस्तु 2F (फोकस दूरी का दोगुना = 2 × 20 = 40 सेमी) पर होती है, तब प्रतिबिंब समान आकार का वास्तविक और उल्टा बनता है।",timeEstimate:"45s"},{id:3,section:"Section A - Mathematics",topic:"Linear Equations & Polynomials",classLevel:"Class 9-10",question:"If α and β are the zeroes of the quadratic polynomial P(x) = x² - 5x + 6, the value of (α + β) is:",questionHi:"यदि α तथा β द्विघात बहुपद P(x) = x² - 5x + 6 के शून्यक हैं, तो (α + β) का मान होगा:",options:[{id:"A",text:"6",textHi:"6"},{id:"B",text:"-5",textHi:"-5"},{id:"C",text:"5",textHi:"5"},{id:"D",text:"-6",textHi:"-6"}],correctAnswer:"C",marks:4,negativeMarks:0,explanation:"For ax² + bx + c = 0, sum of roots α + β = -b/a = -(-5)/1 = 5.",explanationHi:"द्विघात बहुपद में शून्यकों का योग α + β = -b/a = -(-5)/1 = 5 होता है।",timeEstimate:"30s"},{id:4,section:"Section A - Science",topic:"Cell Structure & Functions",classLevel:"Class 8-10",question:'Which cell organelle is known as the "Powerhouse of the Cell"?',questionHi:'किस कोशिकांग को "कोशिका का शक्तिगृह (
