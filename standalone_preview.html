0.5) / 20 = 200 / 20 = 10 m.",explanationHi:"अधिकतम ऊंचाई H = (u² sin²θ) / (2g)। यहाँ u = 20 m/s, θ = 45°, और g = 10 m/s²। अतः H = (400 × 0.5) / 20 = 10 मीटर।",timeEstimate:"42s"},{id:2,section:"Section A - Science",topic:"Light & Optics (Class 10)",classLevel:"Class 10",question:"A convex lens has a focal length of 20 cm. At what distance from the lens should an object be placed to form a real, inverted image of the same size?",questionHi:"एक उत्तल लेंस की फोकस दूरी 20 सेमी है। लेंस से कितनी दूरी पर वस्तु को रखा जाए ताकि उसी आकार का वास्तविक एवं उल्टा प्रतिबिंब बने?",options:[{id:"A",text:"10 cm",textHi:"10 सेमी"},{id:"B",text:"20 cm",textHi:"20 सेमी"},{id:"C",text:"40 cm (at 2F)",textHi:"40 सेमी (2F पर)"},{id:"D",text:"60 cm",textHi:"60 सेमी"}],correctAnswer:"C",marks:4,negativeMarks:0,explanation:"For a convex lens, when an object is placed at 2F (twice the focal length = 2 × 20 cm = 40 cm), the image formed is real, inverted, and of the exact same size as the object.",explanationHi:"उत्तल लेंस के लिए जब वस्तु 2F (फोकस दूरी का दोगुना = 2 × 20 = 40 सेमी) पर होती है, तब प्रतिबिंब समान आकार का वास्तविक और उल्टा बनता है।",timeEstimate:"45s"},{id:3,section:"Section A - Mathematics",topic:"Linear Equations & Polynomials",classLevel:"Class 9-10",question:"If α and β are the zeroes of the quadratic polynomial P(x) = x² - 5x + 6, the value of (α + β) is:",questionHi:"यदि α तथा β द्विघात बहुपद P(x) = x² - 5x + 6 के शून्यक हैं, तो (α + β) का मान होगा:",options:[{id:"A",text:"6",textHi:"6"},{id:"B",text:"-5",textHi:"-5"},{id:"C",text:"5",textHi:"5"},{id:"D",text:"-6",textHi:"-6"}],correctAnswer:"C",marks:4,negativeMarks:0,explanation:"For ax² + bx + c = 0, sum of roots α + β = -b/a = -(-5)/1 = 5.",explanationHi:"द्विघात बहुपद में शून्यकों का योग α + β = -b/a = -(-5)/1 = 5 होता है।",timeEstimate:"30s"},{id:4,section:"Section A - Science",topic:"Cell Structure & Functions",classLevel:"Class 8-10",question:'Which cell organelle is known as the "Powerhouse of the Cell"?',questio thon Basics",question:"Python एक _____ भाषा है। (Python is a _____ language.)",questionHi:"Python एक _____ भाषा है।",options:[{id:"A",text:"High-level",textHi:"High-level (उच्च स्तरीय)"},{id:"B",text:"Low-level",textHi:"Low-level (निम्न स्तरीय)"},{id:"C",text:"Assembly",textHi:"Assembly"},{id:"D",text:"Machine",textHi:"Machine"}],correctAnswer:"A",marks:1,negativeMarks:0,explanation:"Python is an interpreted, high-level, general-purpose programming language. (पायथन एक उच्च स्तरीय प्रोग्रामिंग भाषा है।)",timeEstimate:"30s"},{id:2,chapter:"Chapter 5: Getting Started with Python",topic:"Comments",question:"Python में comments किस चिन्ह से शुरू होते हैं? (Comments in Python start with which symbol?)",questionHi:"Python में comments किस चिन्ह से शुरू होते हैं?",options:[{id:"A",text:"//",textHi:"//"},{id:"B",text:"/*",textHi:"/*"},{id:"C",text:"#",textHi:"#"},{id:"D",text:"--",textHi:"--"}],correctAnswer:"C",marks:1,negativeMarks:0,explanation:"Single line comments in Python start with the '#' character. (पायथन में टिप्पणियाँ '#' चिन्ह से शुरू होती हैं।)",timeEstimate:"20s"},{id:3,chapter:"Chapter 5: Getting Started with Python",topic:"Keywords",question:"इनमें से कौन सा Python का कीवर्ड (keyword) नहीं है? (Which of the following is NOT a Python keyword?)",questionHi:"इनमें से कौन सा Python का कीवर्ड (keyword) नहीं है?",options:[{id:"A",text:"for",textHi:"for"},{id:"B",text:"while",textHi:"while"},{id:"C",text:"do",textHi:"do"},{id:"D",text:"if",textHi:"if"}],correctAnswer:"C",marks:1,negativeMarks:0,explanation:"'do' is not a keyword in Python (unlike C/C++/Java). Python has 'for' and 'while'. (पायथन में 'do' कीवर्ड नहीं होता है।)",timeEstimate:"25s"},{id:4,chapter:"Chapter 5: Getting Started with Python",topic:"Identifiers & Variables",question:"Python में variable का नाम किससे शुरू नहीं हो सकता? (A variable name in Python cannot start with?)",questionHi:"Python में variable का नाम किससे शुरू नहीं हो सकता?",options:[{id:"A",text:"Alphabet",textHi:"Alphabet (अक्षर)"},{i  it immediately. ('break' लूप को तत्काल समाप्त कर देता है।)",timeEstimate:"20s"},{id:11,chapter:"Chapter 6: Flow of Control",topic:"Range Function",question:"range(5) कौन सी sequence जनरेट करेगा? (What sequence will range(5) generate?)",questionHi:"range(5) कौन सी sequence जनरेट करेगा?",options:[{id:"A",text:"1, 2, 3, 4, 5",textHi:"1, 2, 3, 4, 5"},{id:"B",text:"0, 1, 2, 3, 4, 5",textHi:"0, 1, 2, 3, 4, 5"},{id:"C",text:"0, 1, 2, 3, 4",textHi:"0, 1, 2, 3, 4"},{id:"D",text:"1, 2, 3, 4",textHi:"1, 2, 3, 4"}],correctAnswer:"C",marks:1,negativeMarks:0,explanation:"range(n) starts from 0 and stops at n-1. So range(5) gives 0, 1, 2, 3, 4. (range(5) 0 से 4 तक की संख्याएं देता है।)",timeEstimate:"25s"},{id:12,chapter:"Chapter 6: Flow of Control",topic:"Continue Statement",question:"लूप के करंट इटरेशन (iteration) को स्किप करने के लिए किस कीवर्ड का प्रयोग होता है? (Which keyword skips the current loop iteration?)",questionHi:"लूप के करंट इटरेशन (iteration) को स्किप करने के लिए किस कीवर्ड का प्रयोग होता है?",options:[{id:"A",text:"pass",textHi:"pass"},{id:"B",text:"skip",textHi:"skip"},{id:"C",text:"break",textHi:"break"},{id:"D",text:"continue",textHi:"continue"}],correctAnswer:"D",marks:1,negativeMarks:0,explanation:"'continue' skips the rest of the code in current iteration and moves to next cycle. ('continue' वर्तमान इटरेशन को छोड़कर अगले पर जाता है।)",timeEstimate:"20s"},{id:13,chapter:"Chapter 6: Flow of Control",topic:"Nested Loops",question:"नेस्टेड लूप (Nested loop) का क्या अर्थ है? (What does Nested loop mean?)",questionHi:"नेस्टेड लूप (Nested loop) का क्या अर्थ है?",options:[{id:"A",text:"Loop inside a loop",textHi:"Loop के अंदर loop"},{id:"B",text:"Loop outside a loop",textHi:"Loop के बाहर loop"},{id:"C",text:"Infinite loop",textHi:"Infinite loop"},{id:"D",text:"None of these",textHi:"इनमें से कोई नहीं"}],correctAnswer:"A",marks:1,negativeMarks:0,explanation:"A loop placed inside the body of another loop is called a nested loop. (एक लूप के भीतर दूसरा लूप नेस्टेड लूप कहलाता है।)",timeEstimate:"20s"},{id:14,chapter:"Chapter 6: Flow of Control",topic:"elif Clause",question:"if-elif-else में 'elif' का क्या अर्थ है? (What does 'elif' mean in if-elif-else?)",questionHi:"if-elif-else में 'elif' का क्या अर्थ है?",options:[{id:"A",text:"else if",textHi:"else if"},{id:"B",text:"empty if",textHi:"empty if"},{id:"C",text:"error if",textHi:"error if"},{id:"D",text:"equal if",textHi:"equal if"}],correctAnswer:"A",marks:1,negativeMarks:0,explanation:"'elif' is short for 'else if' in Python. ('elif' का अर्थ 'else if' होता है।)",timeEstimate:"20s"},{id:15,chapter:"Chapter 7: Functions",topic:"Function Definition",question:"Python में फ़ंक्शन को परिभाषित (define) करने के लिए किस कीवर्ड का उपयोग होता है? (Which keyword is used to define a function?)",questionHi:"Python में फ़ंक्शन को परिभाषित (define) करने के लिए किस कीवर्ड का उपयोग होता है?",options:[{id:"A",text:"function",textHi:"function"},{id:"B",text:"def",textHi:"def"},{id:"C",text:"fun",textHi:"fun"},{id:"D",text:"define",textHi:"define"}],correctAnswer:"B",marks:1,negativeMarks:0,explanation:"'def' keyword is used to define a user-defined function in Python. ('def' कीवर्ड से फ़ंक्शन शुरू होता है।)",timeEstimate:"20s"},{id:16,chapter:"Chapter 7: Functions",topic:"Arguments",question:"फ़ंक्शन को कॉल करते समय जो वैल्यू पास की जाती है, उसे क्या कहते हैं? (Value passed while calling a function is called?)",questionHi:"फ़ंक्शन को कॉल करते समय जो वैल्यू पास की जाती है, उसे क्या कहते हैं?",options:[{id:"A",text:"Parameter",textHi:"Parameter (पैरामीटर)"},{id:"B",text:"Argument",textHi:"Argument (आर्ग्युमेंट)"},{id:"C",text:"Return value",textHi:"Return value"},{id:"D",text:"Keyword",textHi:"Keyword"}],correctAnswer:"B",marks:1,negativeMarks:0,explanation:"Arguments are the actual values passed to function during invocation; parameters are variables in header. (कॉल करते समय दी गई वैल्यू को Argument कहते हैं।)",timeEstimate:"25s"},{id:17,chapter:"Chapter 7: Functions",topic:"Return Statement",question:"फ़ंक्शन से वैल्यू वापस भेजने के लिए किस स्टेटमेंट का उपयोग होता है? (Which statement returns value from a function?)",questionHi:"फ़ंक्शन से वैल्यू वापस भेजने के लिए किस स्टेटमेंट का उपयोग होता है?",options:[{id:"A",text:"return",textHi:"return"},{id:"B",text:"yield",textHi:"yield"},{id:"C",text:"send",textHi:"send"},{id:"D",text:"give",textHi:"give"}],correctAnswer:"A",marks:1,negativeMarks:0,explanation:"The 'return' statement exits a function and optionally passes back an expression to caller. ('return' स्टेटमेंट परिणाम वापस भेजता है।)",timeEstimate:"20s"},{id:18,chapter:"Chapter 7: Functions",topic:"Default Return",question:"यदि फ़ंक्शन कोई वैल्यू रिटर्न नहीं करता, तो वह डिफ़ॉल्ट रूप से क्या रिटर्न करता है? (If a function returns nothing, what does it return by default?)",questionHi:"यदि फ़ंक्शन कोई वैल्यू रिटर्न नहीं करता, तो वह डिफ़ॉल्ट रूप से क्या रिटर्न करता है?",options:[{id:"A",text:"0",textHi:"0"},{id:"B",text:"False",textHi:"False"},{id:"C",text:"None",textHi:"None"},{id:"D",text:"Empty string",textHi:"Empty string"}],correctAnswer:"C",marks:1,negativeMarks:0,explanation:"Functions without an explicit return statement return the special value 'None'. (कोई वैल्यू न लौटने पर डिफ़ॉल्ट रूप से None रिटर्न होता है।)",timeEstimate:"25s"},{id:19,chapter:"Chapter 7: Functions",topic:"Scope of Variables",question:"जो वेरिएबल फ़ंक्शन के अंदर डिक्लेयर किया जाता है, उसका स्कोप क्या होता है? (What is the scope of variable declared inside function?)",questionHi:"जो वेरिएबल फ़ंक्शन के अंदर डिक्लेयर किया जाता है, उसका स्कोप क्या होता है?",options:[{id:"A",text:"Global",textHi:"Global"},{id:"B",text:"Local",textHi:"Local (स्थानीय)"},{id:"C",text:"Nonlocal",textHi:"Nonlocal"},{id:"D",text:"Universal",textHi:"Universal"}],correctAnswer:"B",marks:1,negativeMarks:0,explanation:"Variables defined inside a function have local scope and cannot be accessed outside. (फ़ंक्शन के अंदर बने वेरिएबल का स्कोप Local होता है।)",timeEstimate:"20s"},{id:20,chapter:"Chapter 7: Functions",topic:"Modules",question:"'math' मॉड्यूल को प्रोग्राम में शामिल करने के लिए किस स्टेटमेंट का उपयोग होता है? (Which statement includes math module?)",questionHi:"'math' मॉड्यूल को प्रोग्राम में शामिल करने के लिए किस स्टेटमेंट का उपयोग होता है?",options:[{id:"A",text:"include math",textHi:"include math"},{id:"B",text:"using math",textHi:"using math"},{id:"C",text:"import math",textHi:"import math"},{id:"D",text:"get math",textHi:"get math"}],correctAnswer:"C",marks:1,negativeMarks:0,explanation:"The 'import' keyword imports modules in Python: 'import math'. (मॉड्यूल जोड़ने के लिए 'import' स्टेटमेंट का उपयोग होता है।)",timeEstimate:"20s"},{id:21,chapter:"Chapter 7: Functions",topic:"abs() Function",question:"Python में abs(-5) का आउटपुट क्या होगा? (What will be output of abs(-5) in Python?)",questionHi:"Python में abs(-5) का आउटपुट क्या होगा?",options:[{id:"A",text:"-5",textHi:"-5"},{id:"B",text:"5",textHi:"5"},{id:"C",text:"0",textHi:"0"},{id:"D",text:"Error",textHi:"Error"}],correctAnswer:"B",marks:1,negativeMarks:0,explanation:"abs() function returns the absolute value of a number. abs(-5) = 5. (abs() संख्या का निरपेक्ष (धनात्मक) मान देता है।)",timeEstimate:"20s"},{id:22,chapter:"Chapter 8: Strings",topic:"String Immutability",question:"Python में स्ट्रिंग (String) क्या है? (What is String in Python?)",questionHi:"Python में स्ट्रिंग (String) क्या है?",options:[{id:"A",text:"Mutable",textHi:"Mutable (परिवर्तनीय)"},{id:"B",text:"Immutable",textHi:"Immutable (अपरिवर्तनीय)"},{id:"C",text:"Integer",textHi:"Integer"},{id:"D",text:"List",textHi:"List"}],correctAnswer:"B",marks:1,negativeMarks:0,explanation:"Strings are immutable in Python; their individual characters cannot be modified in place. (स्ट्रिंग में परिवर्तन नहीं किया जा सकता, यह Immutable है।)",timeEstimate:"20s"},{id:23,chapter:"Chapter 8: Strings",topic:"len() Function",question:"स्ट्रिंग की लंबाई (length) जानने के लिए किस फ़ंक्शन का उपयोग किया जाता है? (Which function finds the length of string?)",questionHi:"स्ट्रिंग की लंबाई (length) जानने के लिए किस फ़ंक्शन का उपयोग किया जाता है?",options:[{id:"A",text:"count()",textHi:"count()"},{id:"B",text:"size()",textHi:"size()"},{id:"C",text:"len()",textHi:"len()"},{id:"D",text:"length()",textHi:"length()"}],correctAnswer:"C",marks:1,negativeMarks:0,explanation:"len() function returns the number of items in an object, e.g. len('Python') = 6. (len() फ़ंक्शन लंबाई बताता है।)",timeEstimate:"20s"},{id:24,chapter:"Chapter 8: Strings",topic:"String Indexing",question:'यदि s = "Python" है, तो s[1] का मान क्या होगा? (If s = "Python", what is s[1]?)',questionHi:'यदि s = "Python" है, तो s[1] का मान क्या होगा?',options:[{id:"A",text:"P",textHi:"P"},{id:"B",text:"y",textHi:"y"},{id:"C",text:"t",textHi:"t"},{id:"D",text:"h",textHi:"h"}],correctAnswer:"B",marks:1,negativeMarks:0,explanation:"Index in Python starts from 0. s[0] = 'P', s[1] = 'y'. (इंडेक्स 0 से शुरू होता है, अतः s[1] 'y' होगा।)",timeEstimate:"25s"},{id:25,chapter:"Chapter 8: Strings",topic:"Negative Indexing",question:"स्ट्रिंग के अंत से इंडेक्सिंग (Negative indexing) की शुरुआत किस नंबर से होती है? (Negative indexing starts from which number?)",questionHi:"स्ट्रिंग के अंत से इंडेक्सिंग (Negative indexing) की शुरुआत किस नंबर से होती है?",options:[{id:"A",text:"0",textHi:"0"},{id:"B",text:"1",textHi:"1"},{id:"C",text:"-1",textHi:"-1"},{id:"D",text:"-0",textHi:"-0"}],correctAnswer:"C",marks:1,negativeMarks:0,explanation:"Negative indexing starts from -1 from the rightmost end. (दाएं छोर से पहली स्थिति का इंडेक्स -1 होता है।)",timeEstimate:"20s"},{id:26,chapter:"Chapter 8: Strings",topic:"String Concatenation",question:"दो स्ट्रिंग्स को जोड़ने (concatenation) के लिए किस ऑपरेटर का उपयोग होता है? (Which operator concatenates strings?)",questionHi:"दो स्ट्रिंग्स को जोड़ने (concatenation) के लिए किस ऑपरेटर का उपयोग होता है?",options:[{id:"A",text:"+",textHi:"+"},{id:"B",text:"*",textHi:"*"},{id:"C",text:"&",textHi:"&"},{id:"D",text:"-",textHi:"-"}],correctAnswer:"A",marks:1,negativ utability",question:"क्या लिस्ट (List) म्यूटेबल (mutable) होती है? (Is List mutable in Python?)",questionHi:"क्या लिस्ट (List) म्यूटेबल (mutable) होती है?",options:[{id:"A",text:"Yes",textHi:"हाँ"},{id:"B",text:"No",textHi:"नहीं"},{id:"C",text:"Only for integers",textHi:"केवल इंटीजर के लिए"},{id:"D",text:"Cannot say",textHi:"कह नहीं सकते"}],correctAnswer:"A",marks:1,negativeMarks:0,explanation:"Yes, Lists in Python are mutable; their elements can be modified in place. (हाँ, लिस्ट परिवर्तनीय (mutable) होती है।)",timeEstimate:"20s"},{id:31,chapter:"Chapter 9: Lists",topic:"append() Method",question:"लिस्ट के अंत में नया एलिमेंट जोड़ने के लिए कौन सा मेथड इस्तेमाल होता है? (Which method adds element at the end of list?)",questionHi:"लिस्ट के अंत में नया एलिमेंट जोड़ने के लिए कौन सा मेथड इस्तेमाल होता है?",options:[{id:"A",text:"add()",textHi:"add()"},{id:"B",text:"insert()",textHi:"insert()"},{id:"C",text:"append()",textHi:"append()"},{id:"D",text:"extend()",textHi:"extend()"}],correctAnswer:"C",marks:1,negativeMarks:0,explanation:"append() adds a single element to the very end of list. (append() लिस्ट के अंत में नया तत्व जोड़ता है।)",timeEstimate:"20s"},{id:32,chapter:"Chapter 9: Lists",topic:"insert() Method",question:"लिस्ट में किसी विशेष इंडेक्स पर एलिमेंट जोड़ने के लिए कौन सा मेथड उपयोग होता है? (Which method adds element at a specific index?)",questionHi:"लिस्ट में किसी विशेष इंडेक्स पर एलिमेंट जोड़ने के लिए कौन सा मेथड उपयोग होता है?",options:[{id:"A",text:"append()",textHi:"append()"},{id:"B",text:"insert()",textHi:"insert()"},{id:"C",text:"push()",textHi:"push()"},{id:"D",text:"place()",textHi:"place()"}],correctAnswer:"B",marks:1,negativeMarks:0,explanation:"insert(index, element) inserts an item at the specified index position. (insert() निश्चित इंडेक्स पर तत्व जोड़ता है।)",timeEstimate:"25s"},{id:33,chapter:"Chapter 9: Lists",topic:"pop() Method",question:"pop() मेथड डिफ़ॉल्ट रूप से कौन सा एलिमेंट हटाता है? (Which element does pop() remove by default?)",ques icides",textHi:"कीटनाशक"}],correctAnswer:"C",marks:1,explanation:"यूरिया, अमोनियम सल्फेट, सुपर फॉस्फेट, पोटाश, NPK आदि रासायनिक उर्वरक (Fertilizers) हैं जो फैक्ट्रियों में उत्पादित किए जाते हैं।",explanationHi:"यूरिया, अमोनियम सल्फेट, सुपर फॉस्फेट, पोटाश, NPK आदि रासायनिक उर्वरक (Fertilizers) हैं जो फैक्ट्रियों में उत्पादित किए जाते हैं।"}],Pp=[{id:1,chapter:"Chapter 5: Coal and Petroleum",chapterHi:"अध्याय 5: कोयला और पेट्रोलियम",topic:"Carbonisation",topicHi:"कार्बनीकरण",question:"मृत वनस्पति के धीमे प्रक्रम द्वारा कोयले में परिवर्तन को क्या कहते हैं? (Slow process of conversion of dead vegetation into coal?)",questionHi:"मृत वनस्पति के धीमे प्रक्रम द्वारा कोयले में परिवर्तन को क्या कहते हैं?",options:[{id:"A",text:"Carbonisation",textHi:"कार्बनीकरण"},{id:"B",text:"Refining",textHi:"परिष्करण"},{id:"C",text:"Evaporation",textHi:"वाष्पीकरण"},{id:"D",text:"Compression",textHi:"संपीडन"}],correctAnswer:"A",marks:1,explanation:"मृत वनस्पति के धीमे प्रक्रम द्वारा लाखों वर्षों में कोयले में परिवर्तित होने को कार्बनीकरण (Carbonisation) कहते हैं।",explanationHi:"मृत वनस्पति के धीमे प्रक्रम द्वारा लाखों वर्षों में कोयले में परिवर्तित होने को कार्बनीकरण (Carbonisation) कहते हैं।"},{id:2,chapter:"Chapter 5: Coal and Petroleum",chapterHi:"अध्याय 5: कोयला और पेट्रोलियम",topic:"Bitumen for Roads",topicHi:"सड़क निर्माण में बिटुमेन",question:"आजकल पक्की सड़कों के निर्माण में कोलतार के स्थान पर किस पेट्रोलियम उत्पाद का प्रयोग किया जाता है? (Petroleum product used in place of coal-tar for surfacing roads?)",questionHi:"आजकल पक्की सड़कों के निर्माण में कोलतार के स्थान पर किस पेट्रोलियम उत्पाद का प्रयोग किया जाता है?",options:[{id:"A",text:"Coke",textHi:"कोक"},{id:"B",text:"CNG",textHi:"सीएनजी"},{id:"C",text:"Bitumen",textHi:"बिटुमेन"},{id:"D",text:"Paraffin wax",textHi:"पैराफिन मोम"}],correctAnswer:"C",marks:1,explanation:"आजकल पक्की सड़कों के निर्माण में कोलतार के स्थान पर एक पेट्रोलियम उत्पाद 'बिटुमेन' (Bitumen) का प्रयोग किया जाता है।",explanationHi:"आजकल पक्की सड़कों के निर्माण में कोलतार के स्थान पर एक पेट्रोलियम उत्पाद 'बिटुमेन' (Bitumen) का प्रयोग किया जाता है।"},{id:3,chapter:"Chapter 5: Coal and Petroleum",chapterHi:"अध्याय 5: कोयला और पेट्रोलियम",topic:"Refining Petroleum",topicHi:"पेट्रोलियम परिष्करण",question:"पेट्रोलियम के विभिन्न संघटकों या प्रभाजों को पृथक करने का प्रक्रम क्या कहलाता है? (Process of separating fractions of petroleum?)",questionHi:"पेट्रोलियम के विभिन्न संघटकों या प्रभाजों को पृथक करने का प्रक्रम क्या कहलाता है?",options:[{id:"A",text:"Carbonisation",textHi:"कार्बनीकरण"},{id:"B",text:"Refining",textHi:"परिष्करण"},{id:"C",text:"Storage",textHi:"भण्डारण"},{id:"D",text:"Natural Gas",textHi:"प्राकृतिक गैस"}],correctAnswer:"B",marks:1,explanation:"पेट्रोलियम के विभिन्न संघटकों/प्रभाजों को पृथक करने का प्रक्रम परिष्करण (Refining) कहलाता है, और यह कार्य पेट्रोलियम परिष्करणी (Refinery) में किया जाता है।",explanationHi:"पेट्रोलियम के विभिन्न संघटकों/प्रभाजों को पृथक करने का प्रक्रम परिष्करण (Refining) कहलाता है, और यह कार्य पेट्रोलियम परिष्करणी (Refinery) में किया जाता है।"},{id:4,chapter:"Chapter 5: Coal and Petroleum",chapterHi:"अध्याय 5: कोयला और पेट्रोलियम",topic:"Inexhaustible Resources",topicHi:"अक्षय प्राकृतिक संसाधन",question:"सूर्य का प्रकाश और वायु किस प्रकार के प्राकृतिक संसाधन हैं? (Sunlight and air are which type of resources?)",questionHi:"सूर्य का प्रकाश और वायु किस प्रकार के प्राकृतिक संसाधन हैं?",options:[{id:"A",text:"Exhaustible resources",textHi:"समाप्त होने वाले"},{id:"B",text:"Man-made resources",textHi:"मानव-निर्मित"},{id:"C",text:"Inexhaustible natural resources",textHi:"अक्षय प्राकृतिक संसाधन"},{id:"D",text:"Fossils",textHi:"जीवाश्म"}],correctAnswer:"C",marks:1,explanation:"सूर्य का प्रकाश और वायु प्रकृति में असीमित मात्रा में उपलब्ध हैं और मानव क्रियाकलापों से समाप्त नहीं होते, अतः इन्हें अक्षय प्राकृतिक संसाधन कहते हैं।",explanationHi:"सूर्य का प्रकाश और वायु प्रकृति में असीमित मात्रा में उपलब्ध हैं और मानव क्रियाकलापों से समाप्त नहीं होते, अतः इन्हें अक्षय प्राकृतिक संसाधन कहते हैं।"},{id:5,chapter:"Chapter 5: Coal and Petroleum",chapterHi:"अध्याय 5: कोयला और पेट्रोलियम",topic:"Exhaustible Resources",topicHi:"समाप्त होने वाले प्राकृतिक संसाधन",question:"इनमें से कौन सा समाप्त होने वाला प्राकृतिक संसाधन है? (Which of these is an exhaustible natural resource?)",questionHi:"इनमें से कौन सा समाप्त होने वाला प्राकृतिक संसाधन है?",options:[{id:"A",text:"Sunlight",textHi:"सूर्य का प्रकाश"},{id:"B",text:"Forests and Wildlife",textHi:"वन और वन्यजीव"},{id:"C",text:"Air",textHi:"वायु"},{id:"D",text:"Sea water",textHi:"समुद्री जल"}],correctAnswer:"B",marks:1,explanation:"वन, वन्यजीव, खनिज, कोयला, पेट्रोलियम और प्राकृतिक गैस सीमित संसाधन हैं जो मानवीय गतिविधियों से समाप्त हो सकते हैं।",explanationHi:"वन, वन्यजीव, खनिज, कोयला, पेट्रोलियम और प्राकृतिक गैस सीमित संसाधन हैं जो मानवीय गतिविधियों से समाप्त हो सकते हैं।"},{id:6,chapter:"Chapter 5: Coal and Petroleum",chapterHi:"अध्याय 5: कोयला और पेट्रोलियम",topic:"Fossil Fuels",topicHi:"जीवाश्मी ईंधन",question:"सजीव प्राणियों के मृत अवशेषों से बनने वाले ईंधन को क्या कहते हैं? (Fuels formed from dead remains of living organisms?)",questionHi:"सजीव प्राणियों के मृत अवशेषों से बनने वाले ईंधन को क्या कहते हैं?",options:[{id:"A",text:"Nuclear fuel",textHi:"नाभिकीय ईंधन"},{id:"B",text:"Fossil fuel",textHi:"जीवाश्मी ईंधन"},{id:"C",text:"Biogas",textHi:"बायोगैस"},{id:"D",text:"Inexhaustible fuel",textHi:"अक्षय ईंधन"}],correctAnswer:"B",marks:1,explanation:"मृत सजीवों के अवशेषों (जीवाश्मों) से लाखों वर्षों में उच्च दाब और ताप पर बनने वाले ईंधनों को जीवाश्मी ईंधन (Fossil Fuels) कहते हैं।",explanationHi:"मृत सजीवों के अवशेषों (जीवाश्मों) से लाखों वर्षों में उच्च दाब और ताप पर बनने वाले ईंधनों को जीवाश्मी ईंधन (Fossil Fuels) कहते हैं।"},{id:7,chapter:"Chapter 5: Coal and Petroleum",chapterHi:"अध्याय 5: कोयला और पेट्रोलियम",topic:"Coal Properties",topicHi:"कोयला के गुण",question:"कौन सा ईंधन पत्थर जैसा कठोर और काले रंग का होता है? (Which fuel is hard as stone and black in color?)",questionHi:"कौन सा ईंधन पत्थर जैसा कठोर और काले रंग का होता है?",options:[{id:"A",text:"Petroleum",textHi:"पेट्रोलियम"},{id:"B",text:"Natural Gas",textHi:"प्राकृतिक गैस"},{id:"C",text:"Coal",textHi:"कोयला"},{id:"D",text:"Charcoal",textHi:"चारकोल"}],correctAnswer:"C",marks:1,explanation:"कोयला पत्थर जैसा कठोर और काले रंग का ठोस जीवाश्म ईंधन होता है जिसका उपयोग ताप बिजली घरों और उद्योगों में होता है।",explanationHi:"कोयला पत्थर जैसा कठोर और काले रंग का ठोस जीवाश्म ईंधन होता है जिसका उपयोग ताप बिजली घरों और उद्योगों में होता है।"},{id:8,chapter:"Chapter 5: Coal and Petroleum",chapterHi:"अध्याय 5: कोयला और पेट्रोलियम",topic:"Combustion of Coal",topicHi:"कोयले का दहन",question:"वायु में गर्म करने पर कोयला मुख्य रूप से कौन सी गैस उत्पन्न करता है? (On heating in air, coal mainly produces which gas?)",questionHi:"वायु में गर्म करने पर कोयला मुख्य रूप से कौन सी गैस उत्पन्न करता है?",options:[{id:"A",text:"Carbon monoxide",textHi:"कार्बन मोनोऑक्साइड"},{id:"B",text:"Methane",textHi:"मीथेन"},{id:"C",text:"Sulphur dioxide",textHi:"सल्फर डाइऑक्साइड"},{id:"D",text:"Carbon dioxide",textHi:"कार्बन डाइऑक्साइड"}],correctAnswer:"D",marks:1,explanation:"वायु में गर्म करने पर कोयला जलता है और मुख्य रूप से कार्बन डाइऑक्साइड गैस (CO₂) उत्पन्न करता है (C + O₂ → CO₂)।",explanationHi:"वायु में गर्म करने पर कोयला जलता है और मुख्य रूप से कार्बन डाइऑक्साइड गैस (CO₂) उत्पन्न करता है (C + O₂ → CO₂)।"},{id:9,chapter:"Chapter 5: Coal and Petroleum",chapterHi:"अध्याय 5: कोयला और पेट्रोलियम",topic:"Products of Coal Processing",topicHi:"कोयले के प्रक्रमण से उत्पाद",question:"उद्योग में कोयले के प्रक्रमण से क्या प्राप्त किया जाता है? (What is obtained by processing coal in industry?)",questionHi:"उद्योग में कोयले के प्रक्रमण से क्या प्राप्त किया जाता है?",options:[{id:"A",text:"Coke",textHi:"कोक"},{id:"B",text:"Coal tar",textHi:"कोलतार"},{id:"C",text:"Coal gas",textHi:"कोयला-गैस"},{id:"D",text:"All of the above",textHi:"उपरोक्त सभी"}],correctAnswer:"D",marks:1,explanation:"उद्योग में कोयले के प्रक्रमण द्वारा कोक, कोलतार तथा कोयला-गैस प्राप्त की जाती है। अतः 'उपरोक्त सभी' सही उत्तर है।",explanationHi:"उद्योग में कोयले के प्रक्रमण द्वारा कोक, कोलतार तथा कोयला-गैस प्राप्त की जाती है। अतः 'उपरोक्त सभी' सही उत्तर है।"},{id:10,chapter:"Chapter 5: Coal and Petroleum",chapterHi:"अध्याय 5: कोयला और पेट्रोलियम",topic:"Pure Form of Carbon",topicHi:"कार्बन का शुद्ध रूप",question:"कार्बन का लगभग शुद्ध रूप कौन सा है? (Which is an almost pure form of carbon?)",questionHi:"कार्बन का लगभग शुद्ध रूप कौन सा है?",options:[{id:"A",text:"Coal tar",textHi:"कोलतार"},{id:"B",text:"Bitumen",textHi:"बिटुमेन"},{id:"C",text:"Coke",textHi:"कोक"},{id:"D",text:"Petroleum",textHi:"पेट्रोलियम"}],correctAnswer:"C",marks:1,explanation:"कोक (Coke) एक कठोर, सरंध्र और काला पदार्थ है जो कार्बन का लगभग शुद्ध रूप होता है। इसका उपयोग इस्पात निर्माण में होता है।",explanationHi:"कोक (Coke) एक कठोर, सरंध्र और काला पदार्थ है जो कार्बन का लगभग शुद्ध रूप होता है। इसका उपयोग इस्पात निर्माण में होता है।"}],Ep=[{id:1,chapter:"Chapter 7: Conservation of Plants and Animals",chapterHi:"अध्याय 7: पौधे एवं जंतुओं का संरक्षण",topic:"Red Data Book",topicHi:"रेड डाटा पुस्तक",question:"वह पुस्तक जिसमें सभी संकटापन्न स्पीशीज़ का रिकार्ड रखा जाता है, क्या कहलाती है? (Book keeping record of endangered species?)",questionHi:"वह पुस्तक जिसमें सभी संकटापन्न स्पीशीज़ का रिकार्ड रखा जाता है, क्या कहलाती है?",options:[{id:"A",text:"Green Data Book",textHi:"ग्रीन डाटा पुस्तक"},{id:"B",text:"Yellow Data Book",textHi:"येलो डाटा पुस्तक"},{id:"C",text:"Red Data Book",textHi:"रेड डाटा पुस्तक"},{id:"D",text:"Blue Data Book",textHi:"ब्लू डाटा पुस्तक"}],correctAnswer:"C",marks:1,explanation:"रेड डाटा पुस्तक (Red Data Book) वह स्रोत पुस्तक है जिसमें सभी संकटापन्न (Endangered) स्पीशीज़ का आधिकारिक रिकॉर्ड रखा जाता है।",explanationHi:"रेड डाटा पुस्तक (Red Data Book) वह स्रोत पुस्तक है जिसमें सभी संकटापन्न (Endangered) स्पीशीज़ का आधिकारिक रिकॉर्ड रखा जाता है।"},{id:2,chapter:"Chapter 7: Conservation of Plants and Animals",chapterHi:"अध्याय 7: पौधे एवं जंतुओं का संरक्षण",topic:"Endemic Species",topicHi:"विशेष क्षेत्री स्पीशीज़",question:"पौधों एवं जन्तुओं की वह स्पीशीज़ जो किसी विशेष क्षेत्र में विशिष्ट रूप से पाई जाती है, उसे क्या कहते हैं? (Species found exclusively in a particular area?)",questionHi:"पौधों एवं जन्तुओं की वह स्पीशीज़ जो किसी विशेष क्षेत्र में विशिष्ट रूप से पाई जाती है, उसे क्या कहते हैं?",options:[{id:"A",text:"Extinct species",textHi:"विलुप्त स्पीशीज़"},{id:"B",text:"Endemic species",textHi:"विशेष क्षेत्री स्पीशीज़"},{id:"C",text:"Migratory species",textHi:"प्रवासी स्पीशीज़"},{id:"D",text:"Endangered species",textHi:"संकटापन्न स्पीशीज़"}],correctAnswer:"B",marks:1,explanation:"पौधों एवं जन्तुओं की वह स्पीशीज़ जो किसी विशेष क्षेत्र में विशिष्ट रूप से पाई जाती है, उसे विशेष क्षेत्री स्पीशीज़ (Endemic Species) कहते हैं।",explanationHi:"पौधों एवं जन्तुओं की वह स्पीशीज़ जो किसी विशेष क्षेत्र में विशिष्ट रूप से पाई जाती है, उसे विशेष क्षेत्री स्पीशीज़ (Endemic Species) कहते हैं।"},{id:3,chapter:"Chapter 7: Conservation of Plants and Animals",chapterHi:"अध्याय 7: पौधे एवं जंतुओं का संरक्षण",topic:"First Reserve Forest of India",topicHi:"भारत का प्रथम आरक्षित वन",question:"भारत का प्रथम आरक्षित वन कौन सा है? (Which is the first reserve forest of India?)",questionHi:"भारत का प्रथम आरक्षित वन कौन सा है?",options:[{id:"A",text:"Kaziranga National Park",textHi:"काजीरंगा राष्ट्रीय उद्यान"},{id:"B",text:"Bharatpur Sanctuary",textHi:"भरतपुर अभ्यारण्य"},{id:"C",text:"Satpura National Park",textHi:"सतपुड़ा राष्ट्रीय उद्यान"},{id:"D",text:"Pachmarhi Sanctuary",textHi:"पचमढ़ी अभ्यारण्य"}],correctAnswer:"C",marks:1,explanation:"सतपुड़ा राष्ट्रीय उद्यान (Satpura National Park) भारत का प्रथम आरक्षित वन है, जहाँ बेहतरीन टीक (सागौन) की लकड़ी पाई जाती है।",explanationHi:"सतपुड़ा राष्ट्रीय उद्यान (Satpura National Park) भारत का प्रथम आरक्षित वन है, जहाँ बेहतरीन टीक (सागौन) की लकड़ी पाई जाती है।"},{id:4,chapter:"Chapter 7: Conservation of Plants and Animals",chapterHi:"अध्याय 7: पौधे एवं जंतुओं का संरक्षण",topic:"Deforestation",topicHi:"वनोन्मूलन",question:"वनों को समाप्त करने पर प्राप्त भूमि का अन्य कार्यों में उपयोग करना क्या कहलाता है? (Clearing of forests and using land for other purposes?)",questionHi:"वनों को समाप्त करने पर प्राप्त भूमि का अन्य कार्यों में उपयोग करना क्या कहलाता है?",options:[{id:"A",text:"Desertification",textHi:"मरुस्थलीकरण"},{id:"B",text:"Deforestation",textHi:"वनोन्मूलन"},{id:"C",text:"Reforestation",textHi:"वृक्षारोपण"},{id:"D",text:"Agriculture",textHi:"कृषि"}],correctAnswer:"B",marks:1,explanation:"वनों को समाप्त करने और प्राप्त भूमि का अन्य कार्यों (जैसे कृषि, घर, कारखाने) में उपयोग करने को वनोन्मूलन (Deforestation) कहते हैं।",explanationHi:"वनों को समाप्त करने और प्राप्त भूमि का अन्य कार्यों (जैसे कृषि, घर, कारखाने) में उपयोग करने को वनोन्मूलन (Deforestation) कहते हैं।"},{id:5,chapter:"Chapter 7: Conservation of Plants and Animals",chapterHi:"अध्याय 7: पौधे एवं जंतुओं का संरक्षण",topic:"Natural Causes of Deforestation",topicHi:"वनोन्मूलन के प्राकृतिक कारण",question:"इनमें से कौन वनोन्मूलन का प्राकृतिक कारक है? (Which of these is a natural cause of deforestation?)",questionHi:"इनमें से कौन वनोन्मूलन का प्राकृतिक कारक है?",options:[{id:"A",text:"Land for agriculture",textHi:"कृषि के लिए भूमि"},{id:"B",text:"Building factories",textHi:"कारखानों का निर्माण"},{id:"C",text:"Forest fires and severe drought",textHi:"दावानल एवं भीषण सूखा"},{id:"D",text:"Making furniture",textHi:"फर्नीचर बनाना"}],correctAnswer:"C",marks:1,explanation:"दावानल (जंगल की भीषण आग) एवं भीषण सूखा वनोन्मूलन के प्राकृतिक कारक हैं, जबकि अन्य मानव-निर्मित कारक हैं।",explanationHi:"दावानल (जंगल की भीषण आग) एवं भीषण सूखा वनोन्मूलन के प्राकृतिक कारक हैं, जबकि अन्य मानव-निर्मित कारक हैं।"},{id:6,chapter:"Chapter 7: Conservation of Plants and Animals",chapterHi:"अध्याय 7: पौधे एवं जंतुओं का संरक्षण",topic:"Deforestation and Atmosphere",topicHi:"वनोन्मूलन एवं वायुमंडल",question:"वनोन्मूलन से वायुमण्डल में किस गैस का स्तर बढ़ता है? (Deforestation causes increase in level of which gas?)",questionHi:"वनोन्मूलन से वायुमण्डल में किस गैस का स्तर बढ़ता है?",options:[{id:"A",text:"Oxygen",textHi:"ऑक्सीजन"},{id:"B",text:"Nitrogen",textHi:"नाइट्रोजन"},{id:"C",text:"Carbon dioxide",textHi:"कार्बन डाइऑक्साइड"},{id:"D",text:"Ozone",textHi:"ओजोन"}],correctAnswer:"C",marks:1,explanation:"पेड़ प्रकाश संश्लेषण में CO₂ का उपयोग करते हैं। पेड़ों की कटाई से वातावरण में कार्बन डाइऑक्साइड (CO₂) की मात्रा बढ़ जाती है।",explanationHi:"पेड़ प्रकाश संश्लेषण में CO₂ का उपयोग करते हैं। पेड़ों की कटाई से वातावरण में कार्बन डाइऑक्साइड (CO₂) की मात्रा बढ़ जाती है।"},{id:7,chapter:"Chapter 7: Conservation of Plants and Animals",chapterHi:"अध्याय 7: पौधे एवं जंतुओं का संरक्षण",topic:"Global Warming",topicHi:"ग्लोबल वार्मिंग (विश्व ऊष्णन)",question:"वायुमण्डल में कार्बन डाइऑक्साइड की मात्रा बढ़ने से क्या होता है? (What happens when CO2 increases in atmosphere?)",questionHi:"वायुमण्डल में कार्बन डाइऑक्साइड की मात्रा बढ़ने से क्या होता है?",options:[{id:"A",text:"Cooling",textHi:"शीतलन"},{id:"B",text:"Global Warming",textHi:"विश्व ऊष्णन (ग्लोबल वार्मिंग)"},{id:"C",text:"Increase in rainfall",textHi:"वर्षा में वृद्धि"},{id:"D",text:"Decrease in soil erosion",textHi:"मृदा अपरदन में कमी"}],correctAnswer:"B",marks:1,explanation:"कार्बन डाइऑक्साइड ऊष्मीय विकिरणों को अवशोषित करती है, जिससे पृथ्वी के तापमान में वृद्धि होती है जिसे विश्व ऊष्णन (Global Warming) कहते हैं।",explanationHi:"कार्बन डाइऑक्साइड ऊष्मीय विकिरणों को अवशोषित करती है, जिससे पृथ्वी के तापमान में वृद्धि होती है जिसे विश्व ऊष्णन (Global Warming) कहते हैं।"},{id:8,chapter:"Chapter 7: Conservation of Plants and Animals",chapterHi:"अध्याय 7: पौधे एवं जंतुओं का संरक्षण",topic:"Desertification",topicHi:"मरुस्थलीकरण",question:"मृदा की ऊपरी परत हटने से नीचे की कठोर चट्टानें दिखाई देने लगती हैं, इससे धीरे-धीरे उर्वर भूमि किसमें बदल जाती है? (Fertile land gradually converts into?)",questionHi:"मृदा की ऊपरी परत हटने से नीचे की कठोर चट्टानें दिखाई देने लगती हैं, इससे धीरे-धीरे उर्वर भूमि किसमें बदल जाती है?",options:[{id:"A",text:"Swamp",textHi:"दलदल"},{id:"B",text:"Pasture",textHi:"चारागाह"},{id:"C",text:"Desert",textHi:"मरुस्थल"},{id:"D",text:"Forest",textHi:"वन"}],correctAnswer:"C",marks:1,explanation:"मृदा अपरदन से उर्वर परत हट जाती है और उपजाऊ भूमि धीरे-धीरे मरुस्थल में परिवर्तित हो जाती है, जिसे मरुस्थलीकरण (Desertification) कहते हैं।",explanationHi:"मृदा अपरदन से उर्वर परत हट जाती है और उपजाऊ भूमि धीरे-धीरे मरुस्थल में परिवर्तित हो जाती है, जिसे मरुस्थलीकरण (Desertification) कहते हैं।"},{id:9,chapter:"Chapter 7: Conservation of Plants and Animals",chapterHi:"अध्याय 7: पौधे एवं जंतुओं का संरक्षण",topic:"Biodiversity",topicHi:"जैव विविधता की परिभाषा",question:"पृथ्वी पर पाए जाने वाले विभिन्न जीवों की प्रजातियाँ और उनके पारस्परिक संबंध क्या कहलाते हैं? (Variety of organisms on earth and their relationships?)",questionHi:"पृथ्वी पर पाए जाने वाले विभिन्न जीवों की प्रजातियाँ और उनके पारस्परिक संबंध क्या कहलाते हैं?",options:[{id:"A",text:"Flora",textHi:"वनस्पतिजात"},{id:"B",text:"Fauna",textHi:"प्राणिजात"},{id:"C",text:"Biodiversity",textHi:"जैव विविधता"},{id:"D",text:"Ecosystem",textHi:"पारितंत्र"}],correctAnswer:"C",marks:1,explanation:"पृथ्वी पर पाए जाने वाले विभिन्न जीवों की विविधता, उनकी प्रजातियाँ एवं पर्यावरण में उनके अंतर्संबंध जैव विविधता (Biodiversity) कहलाते हैं।",explanationHi:"पृथ्वी पर पाए जाने वाले विभिन्न जीवों की विविधता, उनकी प्रजातियाँ एवं पर्यावरण में उनके अंतर्संबंध जैव विविधता (Biodiversity) कहलाते हैं।"},{id:10,chapter:"Chapter 7: Conservation of Plants and Animals",chapterHi:"अध्याय 7: पौधे एवं जंतुओं का संरक्षण",topic:"Pachmarhi Biosphere Reserve",topicHi:"पचमढ़ी जैवमण्डल आरक्षित क्षेत्र",question:"पचमढ़ी जैवमण्डलीय संरक्षित क्षेत्र किस राज्य/क्षेत्र की वनस्पतियों के समान है? (Flora and fauna of Pachmarhi Biosphere Reserve resemble?)",questionHi:"पचमढ़ी जैवमण्डलीय संरक्षित क्षेत्र किस राज्य/क्षेत्र की वनस्पतियों के समान है?",options:[{id:"A",text:"Nilgiri",textHi:"नीलगिरी"},{id:"B",text:"Upper Himalayas & Lower Western Ghats",textHi:"ऊपरी हिमालय एवं निचले पश्चिमी घाट"},{id:"C",text:"Aravalli",textHi:"अरावली"},{id:"D",text:"Sundarbans",textHi:"सुंदरबन"}],correctAnswer:"B",marks:1,explanation:"पचमढ़ी जैवमण्डलीय संरक्षित क्षेत्र के पौधे और जंतु ऊपरी हिमालयी श्रृंखलाओं एवं निचले पश्चिमी घाट के वनस्पतियों और प्राणियों के समान हैं।",explanationHi:"पचमढ़ी जैवमण्डलीय संरक्षित क्षेत्र के पौधे और जंतु ऊपरी हिमालयी श्रृंखलाओं एवं निचले पश्चिमी घाट के वनस्पतियों और प्राणियों के समान हैं।"}],Dp=[{id:1,chapter:"Chapter 5: Coal and Petroleum",chapterHi:"अध्याय 5: कोयला और पेट्रोलियम",topic:"Carbonisation",topicHi:"कार्बनीकरण",question:"मृत वनस्पति के धीमे प्रक्रम द्वारा कोयले में परिवर्तन को क्या कहते हैं? (Slow process of conversion of dead vegetation into coal?)",questionHi:"मृत वनस्पति के धीमे प्रक्रम द्वारा कोयले में परिवर्तन को क्या कहते हैं?",options:[{id:"A",text:"Carbonisation",textHi:"कार्बनीकरण"},{id:"B",text:"Refining",textHi:"परिष्करण"},{id:"C",text:"Evaporation",textHi:"वाष्पीकरण"},{id:"D",text:"Compression",textHi:"संपीडन"}],correctAnswer:"A",marks:1,explanation:"मृत वनस्पति के धीमे प्रक्रम द्वारा लाखों वर्षों में कोयले में परिवर्तित होने को कार्बनीकरण (Carbonisation) कहते हैं।",explanationHi:"मृत वनस्पति के धीमे प्रक्रम द्वारा लाखों वर्षों में कोयले में परिवर्तित होने को कार्बनीकरण (Carbonisation) कहते हैं।"},{id:2,chapter:"Chapter 5: Coal and Petroleum",chapterHi:"अध्याय 5: कोयला और पेट्रोलियम",topic:"Bitumen for Roads",topicHi:"सड़क निर्माण में बिटुमेन",question:"आजकल पक्की सड़कों के निर्माण में कोलतार के स्थान पर किस पेट्रोलियम उत्पाद का प्रयोग किया जाता है? (Petroleum product used in place of coal-tar for surfacing roads?)",questionHi:"आजकल पक्की सड़कों के निर्माण में कोलतार के स्थान पर किस पेट्रोलियम उत्पाद का प्रयोग किया जाता है?",options:[{id:"A",text:"Coke",textHi:"कोक"},{id:"B",text:"CNG",textHi:"सीएनजी"},{id:"C",text:"Bitumen",textHi:"बिटुमेन"},{id:"D",text:"Paraffin wax",textHi:"पैराफिन मोम"}],correctAnswer:"C",marks:1,explanation:"आजकल पक्की सड़कों के निर्माण में कोलतार के स्थान पर एक पेट्रोलियम उत्पाद 'बिटुमेन' (Bitumen) का प्रयोग किया जाता है।",explanationHi:"आजकल पक्की सड़कों के निर्माण में कोलतार के स्थान पर एक पेट्रोलियम उत्पाद 'बिटुमेन' (Bitumen) का प्रयोग किया जाता है।"},{id:3,chapter:"Chapter 5: Coal and Petroleum",chapterHi:"अध्याय 5: कोयला और पेट्रोलियम",topic:"Refining Petroleum",topicHi:"पेट्रोलियम परिष्करण",question:"पेट्रोलियम के विभिन्न संघटकों या प्रभाजों को पृथक करने का प्रक्रम क्या कहलाता है? (Process of separating fractions of petroleum?)",questionHi:"पेट्रोलियम के विभिन्न संघटकों या प्रभाजों को पृथक करने का प्रक्रम क्या कहलाता है?",options:[{id:"A",text:"Carbonisation",textHi:"कार्बनीकरण"},{id:"B",text:"Refining",textHi:"परिष्करण"},{id:"C",text:"Storage",textHi:"भण्डारण"},{id:"D",text:"Natural Gas",textHi:"प्राकृतिक गैस"}],correctAnswer:"B",marks:1,explanation:"पेट्रोलियम के विभिन्न संघटकों/प्रभाजों को पृथक करने का प्रक्रम परिष्करण (Refining) कहलाता है, और यह कार्य पेट्रोलियम परिष्करणी (Refinery) में किया जाता है।",explanationHi:"पेट्रोलियम के विभिन्न संघटकों/प्रभाजों को पृथक करने का प्रक्रम परिष्करण (Refining) कहलाता है, और यह कार्य पेट्रोलियम परिष्करणी (Refinery) में किया जाता है।"},{id:4,chapter:"Chapter 5: Coal and Petroleum",chapterHi:"अध्याय 5: कोयला और पेट्रोलियम",topic:"Inexhaustible Resources",topicHi:"अक्षय प्राकृतिक संसाधन",question:"सूर्य का प्रकाश और वायु किस प्रकार के प्राकृतिक संसाधन हैं? (Sunlight and air are which type of resources?)",questionHi:"सूर्य का प्रकाश और वायु किस प्रकार के प्राकृतिक संसाधन हैं?",options:[{id:"A",text:"Exhaustible resources",textHi:"समाप्त होने वाले"},{id:"B",text:"Man-made resources",textHi:"मानव-निर्मित"},{id:"C",text:"Inexhaustible natural resources",textHi:"अक्षय प्राकृतिक संसाधन"},{id:"D",text:"Fossils",textHi:"जीवाश्म"}],correctAnswer:"C",marks:1,explanation:"सूर्य का प्रकाश और वायु प्रकृति में असीमित मात्रा में उपलब्ध हैं और मानव क्रियाकलापों से समाप्त नहीं होते, अतः इन्हें अक्षय प्राकृतिक संसाधन कहते हैं।",explanationHi:"सूर्य का प्रकाश और वायु प्रकृति में असीमित मात्रा में उपलब्ध हैं और मानव क्रियाकलापों से समाप्त नहीं होते, अतः इन्हें अक्षय प्राकृतिक संसाधन कहत र और काले रंग का होता है?",options:[{id:"A",text:"Petroleum",textHi:"पेट्रोलियम"},{id:"B",text:"Natural Gas",textHi:"प्राकृतिक गैस"},{id:"C",text:"Coal",textHi:"कोयला"},{id:"D",text:"Charcoal",textHi:"चारकोल"}],correctAnswer:"C",marks:1,explanation:"कोयला पत्थर जैसा कठोर और काले रंग का ठोस जीवाश्म ईंधन होता है जिसका उपयोग ताप बिजली घरों और उद्योगों में होता है।",explanationHi:"कोयला पत्थर जैसा कठोर और काले रंग का ठोस जीवाश्म ईंधन होता है जिसका उपयोग ताप बिजली घरों और उद्योगों में होता है।"},{id:8,chapter:"Chapter 5: Coal and Petroleum",chapterHi:"अध्याय 5: कोयला और पेट्रोलियम",topic:"Combustion of Coal",topicHi:"कोयले का दहन",question:"वायु में गर्म करने पर कोयला मुख्य रूप से कौन सी गैस उत्पन्न करता है? (On heating in air, coal mainly produces which gas?)",questionHi:"वायु में गर्म करने पर कोयला मुख्य रूप से कौन सी गैस उत्पन्न करता है?",options:[{id:"A",text:"Carbon monoxide",textHi:"कार्बन मोनोऑक्साइड"},{id:"B",text:"Methane",textHi:"मीथेन"},{id:"C",text:"Sulphur dioxide",textHi:"सल्फर डाइऑक्साइड"},{id:"D",text:"Carbon dioxide",textHi:"कार्बन डाइऑक्साइड"}],correctAnswer:"D",marks:1,explanation:"वायु में गर्म करने पर कोयला जलता है और मुख्य रूप से कार्बन डाइऑक्साइड गैस (CO₂) उत्पन्न करता है (C + O₂ → CO₂)।",explanationHi:"वायु में गर्म करने पर कोयला जलता है और मुख्य रूप से कार्बन डाइऑक्साइड गैस (CO₂) उत्पन्न करता है (C + O₂ → CO₂)।"},{id:9,chapter:"Chapter 5: Coal and Petroleum",chapterHi:"अध्याय 5: कोयला और पेट्रोलियम",topic:"Products of Coal Processing",topicHi:"कोयले के प्रक्रमण से उत्पाद",question:"उद्योग में कोयले के प्रक्रमण से क्या प्राप्त किया जाता है? (What is obtained by processing coal in industry?)",questionHi:"उद्योग में कोयले के प्रक्रमण से क्या प्राप्त किया जाता है?",options:[{id:"A",text:"Coke",textHi:"कोक"},{id:"B",text:"Coal tar",textHi:"कोलतार"},{id:"C",text:"Coal gas",textHi:"कोयला-गैस"},{id:"D",text:"All of the above",textHi:"उपरोक्त सभी"}],correctAnswer:"D",marks:1,explanation:"उद्योग में कोयले के प्रक्रमण द्वारा कोक, कोलतार तथा कोयला-गैस प्राप्त की जाती है। अतः 'उपरोक्त सभी' सही उत्तर है।",explanationHi:"उद्योग में कोयले के प्रक्रमण द्वारा कोक, कोलतार तथा कोयला-गैस प्राप्त की जाती है। अतः 'उपरोक्त सभी' सही उत्तर है।"},{id:10,chapter:"Chapter 5: Coal and Petroleum",chapterHi:"अध्याय 5: कोयला और पेट्रोलियम",topic:"Pure Form of Carbon",topicHi:"कार्बन का शुद्ध रूप",question:"कार्बन का लगभग शुद्ध रूप कौन सा है? (Which is an almost pure form of carbon?)",questionHi:"कार्बन का लगभग शुद्ध रूप कौन सा है?",options:[{id:"A",text:"Coal tar",textHi:"कोलतार"},{id:"B",text:"Bitumen",textHi:"बिटुमेन"},{id:"C",text:"Coke",textHi:"कोक"},{id:"D",text:"Petroleum",textHi:"पेट्रोलियम"}],correctAnswer:"C",marks:1,explanation:"कोक (Coke) एक कठोर, सरंध्र और काला पदार्थ है जो कार्बन का लगभग शुद्ध रूप होता है। इसका उपयोग इस्पात निर्माण में होता है।",explanationHi:"कोक (Coke) एक कठोर, सरंध्र और काला पदार्थ है जो कार्बन का लगभग शुद्ध रूप होता है। इसका उपयोग इस्पात निर्माण में होता है।"},{id:11,chapter:"Chapter 7: Conservation of Plants and Animals",chapterHi:"अध्याय 7: पौधे एवं जंतुओं का संरक्षण",topic:"Red Data Book",topicHi:"रेड डाटा पुस्तक",question:"वह पुस्तक जिसमें सभी संकटापन्न स्पीशीज़ का रिकार्ड रखा जाता है, क्या कहलाती है? (Book keeping record of endangered species?)",questionHi:"वह पुस्तक जिसमें सभी संकटापन्न स्पीशीज़ का रिकार्ड रखा जाता है, क्या कहलाती है?",options:[{id:"A",text:"Green Data Book",textHi:"ग्रीन डाटा पुस्तक"},{id:"B",text:"Yellow Data Book",textHi:"येलो डाटा पुस्तक"},{id:"C",text:"Red Data Book",textHi:"रेड डाटा पुस्तक"},{id:"D",text:"Blue Data Book",textHi:"ब्लू डाटा पुस्तक"}],correctAnswer:"C",marks:1,explanation:"रेड डाटा पुस्तक (Red Data Book) वह स्रोत पुस्तक है जिसमें सभी संकटापन्न (Endangered) स्पीशीज़ का आधिकारिक रिकॉर्ड रखा जाता है।",explanationHi:"रेड डाटा पुस्तक (Red Data Book) वह स्रोत पुस्तक है जिसमें सभी संकटापन्न (Endangered) स्पीशीज़ का आधिकारिक रिकॉर्ड रखा जाता है।"},{id:12,chapter:"Chapter 7: Conservation of Plants and Animals",chapterHi:"अध्याय 7: पौधे एवं जंतुओं का संरक्षण",topic:"Endemic Species",topicHi:"विशेष क्षेत्री स्पीशीज़",question:"पौधों एवं जन्तुओं की वह स्पीशीज़ जो किसी विशेष क्षेत्र में विशिष्ट रूप से पाई जाती है, उसे क्या कहते हैं? (Species found exclusively in a particular area?)",questionHi:"पौधों एवं जन्तुओं की वह स्पीशीज़ जो किसी विशेष क्षेत्र में विशिष्ट रूप से पाई जाती है, उसे क्या कहते हैं?",options:[{id:"A",text:"Extinct species",textHi:"विलुप्त स्पीशीज़"},{id:"B",text:"Endemic species",textHi:"विशेष क्षेत्री स्पीशीज़"},{id:"C",text:"Migratory species",textHi:"प्रवासी स्पीशीज़"},{id:"D",text:"Endangered species",textHi:"संकटापन्न स्पीशीज़"}],correctAnswer:"B",marks:1,explanation:"पौधों एवं जन्तुओं की वह स्पीशीज़ जो किसी विशेष क्षेत्र में विशिष्ट रूप से पाई जाती है, उसे विशेष क्षेत्री स्पीशीज़ (Endemic Species) कहते हैं।",explanationHi:"पौधों एवं जन्तुओं की वह स्पीशीज़ जो किसी विशेष क्षेत्र में विशिष्ट रूप से पाई जाती है, उसे विशेष क्षेत्री स्पीशीज़ (Endemic Species) कहते हैं।"},{id:13,chapter:"Chapter 7: Conservation of Plants and Animals",chapterHi:"अध्याय 7: पौधे एवं जंतुओं का संरक्षण",topic:"First Reserve Forest of India",topicHi:"भारत का प्रथम आरक्षित वन",question:"भारत का प्रथम आरक्षित वन कौन सा है? (Which is the first reserve forest of India?)",questionHi:"भारत का प्रथम आरक्षित वन कौन सा है?",options:[{id:"A",text:"Kaziranga National Park",textHi:"काजीरंगा राष्ट्रीय उद्यान"},{id:"B",text:"Bharatpur Sanctuary",textHi:"भरतपुर अभ्यारण्य"},{id:"C",text:"Satpura National Park",textHi:"सतपुड़ा राष्ट्रीय उद्यान"},{id:"D",text:"Pachmarhi Sanctuary",textHi:"पचमढ़ी अभ्यारण्य"}],correctAnswer:"C",marks:1,explanation:"सतपुड़ा राष्ट्रीय उद्यान (Satpura National Park) भारत का प्रथम आरक्षित वन है, जहाँ बेहतरीन टीक (सागौन) की लकड़ी पाई जाती है।",explanationHi:"सतपुड़ा राष्ट्रीय उद्यान (Satpura National Park) भारत का प्रथम आरक्षित वन है, जहाँ बेहतरीन टीक (सागौन) की लकड़ी पाई जाती है।"},{id:14,chapter:"Chapter 7: Conservation of Plants and Animals",chapterHi:"अध्याय 7: पौधे एवं जंतुओं का संरक्षण",topic:"Deforestation",topicHi:"वनोन्मूलन",question:"वनों को समाप्त करने पर प्राप्त भूमि का अन्य कार्यों में उपयोग करना क्या कहलाता है? (Clearing of forests and using land for other purposes?)",questionHi:"वनों को समाप्त करने पर प्राप्त भूमि का अन्य कार्यों में उपयोग करना क्या कहलाता है?",options:[{id:"A",text:"Desertification",textHi:"मरुस्थलीकरण"},{id:"B",text:"Deforestation",textHi:"वनोन्मूलन"},{id:"C",text:"Reforestation",textHi:"वृक्षारोपण"},{id:"D",text:"Agriculture",textHi:"कृषि"}],correctAnswer:"B",marks:1,explanation:"वनों को समाप्त करने और प्राप्त भूमि का अन्य कार्यों (जैसे कृषि, घर, कारखाने) में उपयोग करने को वनोन्मूलन (Deforestation) कहते हैं।",explanationHi:"वनों को समाप्त करने और प्राप्त भूमि का अन्य कार्यों (जैसे कृषि, घर, कारखाने) में उपयोग करने को वनोन्मूलन (Deforestation) कहते हैं।"},{id:15,chapter:"Chapter 7: Conservation of Plants and Animals",chapterHi:"अध्याय 7: पौधे एवं जंतुओं का संरक्षण",topic:"Natural Causes of Deforestation",topicHi:"वनोन्मूलन के प्राकृतिक कारण",question:"इनमें से कौन वनोन्मूलन का प्राकृतिक कारक है? (Which of these is a natural cause of deforestation?)",questionHi:"इनमें से कौन वनोन्मूलन का प्राकृतिक कारक है?",options:[{id:"A",text:"Land for agriculture",textHi:"कृषि के लिए भूमि"},{id:"B",text:"Building factories",textHi:"कारखानों का निर्माण"},{id:"C",text:"Forest fires and severe drought",textHi:"दावानल एवं भीषण सूखा"},{id:"D",text:"Making furniture",textHi:"फर्नीचर बनाना"}],correctAnswer:"C",marks:1,explanation:"दावानल (जंगल की भीषण आग) एवं भीषण सूखा वनोन्मूलन के प्राकृतिक कारक हैं, जबकि अन्य मानव-निर्मित कारक हैं।",explanationHi:"दावानल (जंगल की भीषण आग) एवं भीषण सूखा वनोन्मूलन के प्राकृतिक कारक हैं, जबकि अन्य मानव-निर्मित कारक हैं।"},{id:16,chapter:"Chapter 7: Conservation of Plants and Animals",chapterHi:"अध्याय 7: पौधे एवं जंतुओं का संरक्षण",topic:"Deforestation and Atmosphere",topicHi:"वनोन्मूलन एवं वायुमंडल",question:"वनोन्मूलन से वायुमण्डल में किस गैस का स्तर बढ़ता है? (Deforestation causes increase in level of which gas?)",questionHi:"वनोन्मूलन से वायुमण्डल में किस गैस का स्तर बढ़ता है?",options:[{id:"A",text:"Oxygen",textHi:"ऑक्सीजन"},{id:"B",text:"Nitrogen",textHi:"नाइट्रोजन"},{id:"C",text:"Carbon dioxide",textHi:"कार्बन डाइऑक्साइड"},{id:"D",text:"Ozone",textHi:"ओजोन"}],correctAnswer:"C",marks:1,explanation:"पेड़ प्रकाश संश्लेषण में CO₂ का उपयोग करते हैं। पेड़ों की कटाई से वातावरण में कार्बन डाइऑक्साइड (CO₂) की मात्रा बढ़ जाती है।",explanationHi:"पेड़ प्रकाश संश्लेषण में CO₂ का उपयोग करते हैं। पेड़ों की कटाई से वातावरण में कार्बन डाइऑक्साइड (CO₂) की मात्रा बढ़ जाती है।"},{id:17,chapter:"Chapter 7: Conservation of Plants and Animals",chapterHi:"अध्याय 7: पौधे एवं जंतुओं का संरक्षण",topic:"Global Warming",topicHi:"ग्लोबल वार्मिंग (विश्व ऊष्णन)",question:"वायुमण्डल में कार्बन डाइऑक्साइड की मात्रा बढ़ने से क्या होता है? (What happens when CO2 increases in atmosphere?)",questionHi:"वायुमण्डल में कार्बन डाइऑक्साइड की मात्रा बढ़ने से क्या होता है?",options:[{id:"A",text:"Cooling",textHi:"शीतलन"},{id:"B",text:"Global Warming",textHi:"विश्व ऊष्णन (ग्लोबल वार्मिंग)"},{id:"C",text:"Increase in rainfall",textHi:"वर्षा में वृद्धि"},{id:"D",text:"Decrease in soil erosion",textHi:"मृदा अपरदन में कमी"}],correctAnswer:"B",marks:1,explanation:"कार्बन डाइऑक्साइड ऊष्मीय विकिरणों को अवशोषित करती है, जिससे पृथ्वी के तापमान में वृद्धि होती है जिसे विश्व ऊष्णन (Global Warming) कहते हैं।",explanationHi:"कार्बन डाइऑक्साइड ऊष्मीय विकिरणों को अवशोषित करती है, जिससे पृथ्वी के तापमान में वृद्धि होती है जिसे विश्व ऊष्णन (Global Warming) कहते हैं।"},{id:18,chapter:"Chapter 7: Conservation of Plants and Animals",chapterHi:"अध्याय 7: पौधे एवं जंतुओं का संरक्षण",topic:"Desertification",topicHi:"मरुस्थलीकरण",question:"मृदा की ऊपरी परत हटने से नीचे की कठोर चट्टानें दिखाई देने लगती हैं, इससे धीरे-धीरे उर्वर भूमि किसमें बदल जाती है? (Fertile land gradually converts into?)",questionHi:"मृदा की ऊपरी परत हटने से नीचे की कठोर चट्टानें दिखाई देने लगती हैं, इससे धीरे-धीरे उर्वर भूमि किसमें बदल जाती है?",options:[{id:"A",text:"Swamp",textHi:"दलदल"},{id:"B",text:"Pasture",textHi:"चारागाह"},{id:"C",text:"Desert",textHi:"मरुस्थल"},{id:"D",text:"Forest",textHi:"वन"}],correctAnswer:"C",marks:1,explanation:"मृदा अपरदन से उर्वर परत हट जाती है और उपजाऊ भूमि धीरे-धीरे मरुस्थल में परिवर्तित हो जाती है, जिसे मरुस्थलीकरण (Desertification) कहते हैं।",explanationHi:"मृदा अपरदन से उर्वर परत हट जाती है और उपजाऊ भूमि धीरे-धीरे मरुस्थल में परिवर्तित हो जाती है, जिसे मरुस्थलीकरण (Desertification) कहते हैं।"},{id:19,chapter:"Chapter 7: Conservation of Plants and Animals",chapterHi:"अध्याय 7: पौधे एवं जंतुओं का संरक्षण",topic:"Biodiversity",topicHi:"जैव विविधता की परिभाषा",question:"पृथ्वी पर पाए जाने वाले विभिन्न जीवों की प्रजातियाँ और उनके पारस्परिक संबंध क्या कहलाते हैं? (Variety of organisms on earth and their relationships?)",questionHi:"पृथ्वी पर पाए जाने वाले विभिन्न जीवों की प्रजातियाँ और उनके पारस्परिक संबंध क्या कहलाते हैं?",options:[{id:"A",text:"Flora",textHi:"वनस्पतिजात"},{id:"B",text:"Fauna",textHi:"प्राणिजात"},{id:"C",text:"Biodiversity",textHi:"जैव विविधता"},{id:"D",text:"Ecosystem",textHi:"पारितंत्र"}],correctAnswer:"C",marks:1,explanation:"पृथ्वी पर पाए जाने वाले विभिन्न जीवों की विविधता, उनकी प्रजातियाँ एवं पर्यावरण में उनके अंतर्संबंध जैव विविधता (Biodiversity) कहलाते हैं।",explanationHi:"पृथ्वी पर पाए जाने वाले विभिन्न जीवों की विविधता, उनकी प्रजातियाँ एवं पर्यावरण में उनके अंतर्संबंध जैव विविधता (Biodiversity) कहलाते हैं।"},{id:20,chapter:"Chapter 7: Conservation of Plants and Animals",chapterHi:"अध्याय 7: पौधे एवं जंतुओं का संरक्षण",topic:"Pachmarhi Biosphere Reserve",topicHi:"पचमढ़ी जैवमण्डल आरक्षित क्षेत्र",question:"पचमढ़ी जैवमण्डलीय संरक्षित क्षेत्र किस राज्य/क्षेत्र की वनस्पतियों के समान है? (Flora and fauna of Pachmarhi Biosphere Reserve resemble?)",questionHi:"पचमढ़ी जैवमण्डलीय संरक्षित क्षेत्र किस राज्य/क्षेत्र की वनस्पतियों के समान है?",options:[{id:"A",text:"Nilgiri",textHi:"नीलगिरी"},{id:"B",text:"Upper Himalayas & Lower Western Ghats",textHi:"ऊपरी हिमालय एवं निचले पश्चिमी घाट"},{id:"C",text:"Aravalli",textHi: ionHi:"वह फसल जिन्हें वर्षा ऋतु में बोया जाता है, क्या कहलाती है?",options:[{id:"A",text:"Rabi crop",textHi:"रबी फसल"},{id:"B",text:"Kharif crop",textHi:"खरीफ़ फसल"},{id:"C",text:"Zaid crop",textHi:"जायद फसल"},{id:"D",text:"Summer crop",textHi:"ग्रीष्म फसल"}],correctAnswer:"B",marks:1,explanation:"वह फसल जिसे वर्षा ऋतु में बोया जाता है, खरीफ़ फसल कहलाती है। भारत में वर्षा ऋतु मुख्यतः जून से सितम्बर तक होती है।",explanationHi:"वह फसल जिसे वर्षा ऋतु में बोया जाता है, खरीफ़ फसल कहलाती है। भारत में वर्षा ऋतु मुख्यतः जून से सितम्बर तक होती है।"},{id:6,chapter:"Chapter 1: Crop Production and Management",chapterHi:"अध्याय 1: फसल उत्पादन एवं प्रबंध",topic:"Rainy Season in India",topicHi:"वर्षा ऋतु की अवधि",question:"भारत में वर्षा ऋतु सामान्यतः किन महीनों के बीच होती है? (Rainy season in India generally occurs during?)",questionHi:"भारत में वर्षा ऋतु सामान्यतः किन महीनों के बीच होती है?",options:[{id:"A",text:"October to March",textHi:"अक्टूबर से मार्च"},{id:"B",text:"January to April",textHi:"जनवरी से अप्रैल"},{id:"C",text:"June to September",textHi:"जून से सितम्बर"},{id:"D",text:"March to May",textHi:"मार्च से मई"}],correctAnswer:"C",marks:1,explanation:"भारत में वर्षा ऋतु सामान्यतः जून से सितम्बर तक होती है, जिसमें खरीफ फसलों की खेती की जाती है।",explanationHi:"भारत में वर्षा ऋतु सामान्यतः जून से सितम्बर तक होती है, जिसमें खरीफ फसलों की खेती की जाती है।"},{id:7,chapter:"Chapter 1: Crop Production and Management",chapterHi:"अध्याय 1: फसल उत्पादन एवं प्रबंध",topic:"Examples of Kharif Crops",topicHi:"खरीफ फसलों के उदाहरण",question:"धान, मक्का, सोयाबीन, मूँगफली और कपास किस प्रकार की फसल के उदाहरण हैं? (Paddy, maize, soybean, groundnut and cotton are examples of?)",questionHi:"धान, मक्का, सोयाबीन, मूँगफली और कपास किस प्रकार की फसल के उदाहरण हैं?",options:[{id:"A",text:"Kharif",textHi:"खरीफ़"},{id:"B",text:"Rabi",textHi:"रबी"},{id:"C",text:"Summer crops",textHi:"ग्रीष्मकालीन"},{id:"D",text:"All of these",textHi:"ये सभी"}],correctAnswer:"A",marks:1,explanation:"धान, मक्का, सोया pterHi:"अध्याय 1: फसल उत्पादन एवं प्रबंध",topic:"Traditional Tools - Plough",topicHi:"पारंपरिक औज़ार - हल",question:"जुताई के लिए उपयोग किए जाने वाले पारंपरिक औज़ार हल का मुख्य भाग लंबी लकड़ी का बना होता है, उसे क्या कहते हैं? (Long wooden rod of plough is called?)",questionHi:"जुताई के लिए उपयोग किए जाने वाले पारंपरिक औज़ार हल का मुख्य भाग लंबी लकड़ी का बना होता है, उसे क्या कहते हैं?",options:[{id:"A",text:"Ploughshare (फाल)",textHi:"फाल"},{id:"B",text:"Ploughshaft (हल-शैफ्ट)",textHi:"हल-शैफ्ट"},{id:"C",text:"Beam (जोत)",textHi:"जोत"},{id:"D",text:"Hoe (कुदाली)",textHi:"कुदाली"}],correctAnswer:"B",marks:1,explanation:"हल का मुख्य भाग लंबी लकड़ी का बना होता है जिसे हल-शैफ्ट (Ploughshaft) कहते हैं, और इसके सिरे पर लोहे की मजबूत त्रिकोणी पत्ती 'फाल' होती है।",explanationHi:"हल का मुख्य भाग लंबी लकड़ी का बना होता है जिसे हल-शैफ्ट (Ploughshaft) कहते हैं, और इसके सिरे पर लोहे की मजबूत त्रिकोणी पत्ती 'फाल' होती है।"},{id:11,chapter:"Chapter 1: Crop Production and Management",chapterHi:"अध्याय 1: फसल उत्पादन एवं प्रबंध",topic:"Cultivator",topicHi:"कल्टीवेटर",question:"आजकल जुताई के लिए ट्रैक्टर द्वारा संचालित किस उपकरण का उपयोग किया जाता है, जिससे श्रम एवं समय दोनों की बचत होती है? (Tractor-driven tool for tilling?)",questionHi:"आजकल जुताई के लिए ट्रैक्टर द्वारा संचालित किस उपकरण का उपयोग किया जाता है, जिससे श्रम एवं समय दोनों की बचत होती है?",options:[{id:"A",text:"Sickle",textHi:"दराँती"},{id:"B",text:"Cultivator",textHi:"कल्टीवेटर"},{id:"C",text:"Seed drill",textHi:"सीड-ड्रिल"},{id:"D",text:"Dhekli",textHi:"ढेकली"}],correctAnswer:"B",marks:1,explanation:"आजकल जुताई ट्रैक्टर द्वारा संचालित कल्टीवेटर से की जाती है जिससे श्रम और समय दोनों की बचत होती है।",explanationHi:"आजकल जुताई ट्रैक्टर द्वारा संचालित कल्टीवेटर से की जाती है जिससे श्रम और समय दोनों की बचत होती है।"},{id:12,chapter:"Chapter 1: Crop Production and Management",chapterHi:"अध्याय 1: फसल उत्पादन एवं प्रबंध",topic:"Seed Selection",topicHi:"बीज चयन विधि",question:"बुआई से पहले अच्छे बीजों की पहचान करने के लिए उन्हें पानी में डाला जाता है। इस प्रक्रिया में क्षतिग्रस्त बीज क्या प्रतिक्रिया देते हैं? (Damaged seeds reaction in water?)",questionHi:"बुआई से पहले अच्छे बीजों की पहचान करने के लिए उन्हें पानी में डाला जाता है। इस प्रक्रिया में क्षतिग्रस्त बीज क्या प्रतिक्रिया देते हैं?",options:[{id:"A",text:"Sink in water",textHi:"पानी में बैठ जाते हैं"},{id:"B",text:"Change water color",textHi:"पानी का रंग बदल देते हैं"},{id:"C",text:"Float on water surface",textHi:"जल पर तैरने लगते हैं"},{id:"D",text:"Germinate instantly",textHi:"अंकुरित हो जाते हैं"}],correctAnswer:"C",marks:1,explanation:"क्षतिग्रस्त बीज अंदर से खोखले और हल्के हो जाते हैं, इसलिए वे पानी की सतह पर तैरने लगते हैं। स्वस्थ भारी बीज नीचे बैठ जाते हैं।",explanationHi:"क्षतिग्रस्त बीज अंदर से खोखले और हल्के हो जाते हैं, इसलिए वे पानी की सतह पर तैरने लगते हैं। स्वस्थ भारी बीज नीचे बैठ जाते हैं।"},{id:13,chapter:"Chapter 1: Crop Production and Management",chapterHi:"अध्याय 1: फसल उत्पादन एवं प्रबंध",topic:"Seed Drill",topicHi:"सीड-ड्रिल",question:"आजकल बुआई के लिए ट्रैक्टर द्वारा संचालित किस उपकरण का उपयोग होता है, जिससे बीजों में समान दूरी एवं गहराई बनी रहती है? (Tool for sowing seeds at uniform distance?)",questionHi:"आजकल बुआई के लिए ट्रैक्टर द्वारा संचालित किस उपकरण का उपयोग होता है, जिससे बीजों में समान दूरी एवं गहराई बनी रहती है?",options:[{id:"A",text:"Rahat",textHi:"रहट"},{id:"B",text:"Thresher",textHi:"थ्रेशर"},{id:"C",text:"Seed drill",textHi:"सीड-ड्रिल"},{id:"D",text:"Cultivator",textHi:"कल्टीवेटर"}],correctAnswer:"C",marks:1,explanation:"सीड-ड्रिल (Seed Drill) द्वारा बुआई करने पर बीजों में समान दूरी और उचित गहराई बनी रहती है तथा बीज मिट्टी से ढँक जाते हैं जिससे पक्षी उन्हें नहीं खा पाते।",explanationHi:"सीड-ड्रिल (Seed Drill) द्वारा बुआई करने पर बीजों में समान दूरी और उचित गहराई बनी रहती है तथा बीज मिट्टी से ढँक जाते हैं जिससे पक्षी उन्हें नहीं खा पाते।"},{id:14,chapter:"Chapter 1: Crop Production and Management",chapterHi:"अध्याय 1: फसल उत्पादन एवं प्रबंध",topic:"Manure & Fertilizers",topicHi:"खाद एवं उर्वरक",question:"वे पदार्थ जिन्हें मिट्टी में पोषक स्तर बनाए रखने के लिए मिलाया जाता है, उन्हें क्या कहते हैं? (Substances added to maintain soil nutrients?)",questionHi:"वे पदार्थ जिन्हें मिट्टी में पोषक स्तर बनाए रखने के लिए मिलाया जाता है, उन्हें क्या कहते हैं?",options:[{id:"A",text:"Weedicides",textHi:"खरपतवारनाशी"},{id:"B",text:"Seeds",textHi:"बीज"},{id:"C",text:"Manure and Fertilizer",textHi:"खाद एवं उर्वरक"},{id:"D",text:"Water",textHi:"जल"}],correctAnswer:"C",marks:1,explanation:"वे पदार्थ जिन्हें मिट्टी में पोषक तत्वों का स्तर बनाए रखने और पौधों की स्वस्थ वृद्धि के लिए मिलाया जाता है, खाद एवं उर्वरक कहलाते हैं।",explanationHi:"वे पदार्थ जिन्हें मिट्टी में पोषक तत्वों का स्तर बनाए रखने और पौधों की स्वस्थ वृद्धि के लिए मिलाया जाता है, खाद एवं उर्वरक कहलाते हैं।"},{id:15,chapter:"Chapter 1: Crop Production and Management",chapterHi:"अध्याय 1: फसल उत्पादन एवं प्रबंध",topic:"Chemical Fertilizers",topicHi:"रासायनिक उर्वरक",question:"यूरिया, अमोनियम सल्फेट, सुपर फॉस्फेट और पोटाश किसके उदाहरण हैं? (Urea, ammonium sulphate, super phosphate, potash are examples of?)",questionHi:"यूरिया, अमोनियम सल्फेट, सुपर फॉस्फेट और पोटाश किसके उदाहरण हैं?",options:[{id:"A",text:"Organic manure",textHi:"जैविक खाद"},{id:"B",text:"Weeds",textHi:"खरपतवार"},{id:"C",text:"Fertilizers",textHi:"उर्वरक"},{id:"D",text:"Pesticides",textHi:"कीटनाशक"}],correctAnswer:"C",marks:1,explanation:"यूरिया, अमोनियम सल्फेट, सुपर फॉस्फेट, पोटाश, NPK आदि रासायनिक उर्वरक (Fertilizers) हैं जो फैक्ट्रियों में उत्पादित किए जाते हैं।",explanationHi:"यूरिया, अमोनियम सल्फेट, सुपर फॉस्फेट, पोटाश, NPK आदि रासायनिक उर्वरक (Fertilizers) हैं जो फैक्ट्रियों में उत्पादित किए जाते हैं।"},{id:16,chapter:"Chapter 5: Coal and Petroleum",chapterHi:"अध्याय 5: कोयला और पेट्रोलियम",topic:"Carbonisation",topicHi:"कार्बनीकरण",question:"मृत वनस्पति के धीमे प्रक्रम द्वारा कोयले में परिवर्तन को क्या कहते हैं? (Slow process of conversion of dead vegetation into coal?)",questionHi:"मृत वनस्पति के धीमे प्रक्रम द्वारा कोयले में परिवर्तन को क्या कहते हैं?",options:[{id:"A",text:"Carbonisation",textHi:"कार्बनीकरण"},{id:"B",text:"Refining",textHi:"परिष्करण"},{id:"C",text:"Evaporation",textHi:"वाष्पीकरण"},{id:"D",text:"Compression",textHi:"संपीडन"}],correctAnswer:"A",marks:1,explanation:"मृत वनस्पति के धीमे प्रक्रम द्वारा लाखों वर्षों में कोयले में परिवर्तित होने को कार्बनीकरण (Carbonisation) कहते हैं।",explanationHi:"मृत वनस्पति के धीमे प्रक्रम द्वारा लाखों वर्षों में कोयले में परिवर्तित होने को कार्बनीकरण (Carbonisation) कहते हैं।"},{id:17,chapter:"Chapter 5: Coal and Petroleum",chapterHi:"अध्याय 5: कोयला और पेट्रोलियम",topic:"Bitumen for Roads",topicHi:"सड़क निर्माण में बिटुमेन",question:"आजकल पक्की सड़कों के निर्माण में कोलतार के स्थान पर किस पेट्रोलियम उत्पाद का प्रयोग किया जाता है? (Petroleum product used in place of coal-tar for surfacing roads?)",questionHi:"आजकल पक्की सड़कों के निर्माण में कोलतार के स्थान पर किस पेट्रोलियम उत्पाद का प्रयोग किया जाता है?",options:[{id:"A",text:"Coke",textHi:"कोक"},{id:"B",text:"CNG",textHi:"सीएनजी"},{id:"C",text:"Bitumen",textHi:"बिटुमेन"},{id:"D",text:"Paraffin wax",textHi:"पैराफिन मोम"}],correctAnswer:"C",marks:1,explanation:"आजकल पक्की सड़कों के निर्माण में कोलतार के स्थान पर एक पेट्रोलियम उत्पाद 'बिटुमेन' (Bitumen) का प्रयोग किया जाता है।",explanationHi:"आजकल पक्की सड़कों के निर्माण में कोलतार के स्थान पर एक पेट्रोलियम उत्पाद 'बिटुमेन' (Bitumen) का प्रयोग किया जाता है।"},{id:18,chapter:"Chapter 5: Coal and Petroleum",chapterHi:"अध्याय 5: कोयला और पेट्रोलियम",topic:"Refining Petroleum",topicHi:"पेट्रोलियम परिष्करण",question:"पेट्रोलियम के विभिन्न संघटकों या प्रभाजों को पृथक करने का प्रक्रम क्या कहलाता है? (Process of separating fractions of petroleum?)",questionHi:"पेट्रोलियम के विभिन्न संघटकों या प्रभाजों को पृथक करने का प्रक्रम क्या कहलाता है?",options:[{id:"A",text:"Carbonisation",textHi:"कार्बनीकरण"},{id:"B",text:"Refining",textHi:"परिष्करण"},{id:"C",text:"Storage",textHi:"भण्डारण"},{id:"D",text:"Natural Gas",textHi:"प्राकृतिक गैस"}],correctAnswer:"B",marks:1,explanation:"पेट्रोलियम के विभिन्न संघटकों/प्रभाजों को पृथक करने का प्रक्रम परिष्करण (Refining) कहलाता है, और यह कार्य पेट्रोलियम परिष्करणी (Refinery) में किया जाता है।",explanationHi:"पेट्रोलियम के विभिन्न संघटकों/प्रभाजों को पृथक करने का प्रक्रम परिष्करण (Refining) कहलाता है, और यह कार्य पेट्रोलियम परिष्करणी (Refinery) में किया जाता है।"},{id:19,chapter:"Chapter 5: Coal and Petroleum",chapterHi:"अध्याय 5: कोयला और पेट्रोलियम",topic:"Inexhaustible Resources",topicHi:"अक्षय प्राकृतिक संसाधन",question:"सूर्य का प्रकाश और वायु किस प्रकार के प्राकृतिक संसाधन हैं? (Sunlight and air are which type of resources?)",questionHi:"सूर्य का प्रकाश और वायु किस प्रकार के प्राकृतिक संसाधन हैं?",options:[{id:"A",text:"Exhaustible resources",textHi:"समाप्त होने वाले"},{id:"B",text:"Man-made resources",textHi:"मानव-निर्मित"},{id:"C",text:"Inexhaustible natural resources",textHi:"अक्षय प्राकृतिक संसाधन"},{id:"D",text:"Fossils",textHi:"जीवाश्म"}],correctAnswer:"C",marks:1,explanation:"सूर्य का प्रकाश और वायु प्रकृति में असीमित मात्रा में उपलब्ध हैं और मानव क्रियाकलापों से समाप्त नहीं होते, अतः इन्हें अक्षय प्राकृतिक संसाधन कहते हैं।",explanationHi:"सूर्य का प्रकाश और वायु प्रकृति में असीमित मात्रा में उपलब्ध हैं और मानव क्रियाकलापों से समाप्त नहीं होते, अतः इन्हें अक्षय प्राकृतिक संसाधन कहते हैं।"},{id:20,chapter:"Chapter 5: Coal and Petroleum",chapterHi:"अध्याय 5: कोयला और पेट्रोलियम",topic:"Exhaustible Resources",topicHi:"समाप्त होने वाले प्राकृतिक संसाधन",question:"इनमें से कौन सा समाप्त होने वाला प्राकृतिक संसाधन है? (Which of these is an exhaustible natural resource?)",questionHi:"इनमें से कौन सा समाप्त होने वाला प्राकृतिक संसाधन है?",options:[{id:"A",text:"Sunlight",textHi:"सूर्य का प्रकाश"},{id:"B",text:"Forests and Wildlife",textHi:"वन और वन्यजीव"},{id:"C",text:"Air",textHi:"वायु"},{id:"D",text:"Sea water",textHi:"समुद्री जल"}],correctAnswer:"B",marks:1,explanation:"वन, वन्यजीव, खनिज, कोयला, पेट्रोलियम और प्राकृतिक गैस सीमित संसाधन हैं जो मानवीय गतिविधियों से समाप्त हो सकते हैं।",explanationHi:"वन, वन्यजीव, खनिज, कोयला, पेट्रोलियम और प्राकृतिक गैस सीमित संसाधन हैं जो मानवीय गतिविधियों से समाप्त हो सकते हैं।"},{id:21,chapter:"Chapter 5: Coal and Petroleum",chapterHi:"अध्याय 5: कोयला और पेट्रोलियम",topic:"Fossil Fuels",topicHi:"जीवाश्मी ईंधन",question:"सजीव प्राणियों के मृत अवशेषों से बनने वाले ईंधन को क्या कहते हैं? (Fuels formed from dead remains of living organisms?)",questionHi:"सजीव प्राणियों के मृत अवशेषों से बनने वाले ईंधन को क्या कहते हैं?",options:[{id:"A",text:"Nuclear fuel",textHi:"नाभिकीय ईंधन"},{id:"B",text:"Fossil fuel",textHi:"जीवाश्मी ईंधन"},{id:"C",text:"Biogas",textHi:"बायोगैस"},{id:"D",text:"Inexhaustible fuel",textHi:"अक्षय ईंधन"}],correctAnswer:"B",marks:1,explanation:"मृत सजीवों के अवशेषों (जीवाश्मों) से लाखों वर्षों में उच्च दाब और ताप पर बनने वाले ईंधनों को जीवाश्मी ईंधन (Fossil Fuels) कहते हैं।",explanationHi:"मृत सजीवों के अवशेषों (जीवाश्मों) से लाखों वर्षों में उच्च दाब और ताप पर बनने वाले ईंधनों को जीवाश्मी ईंधन (Fossil Fuels) कहते हैं।"},{id:22,chapter:"Chapter 5: Coal and Petroleum",chapterHi:"अध्याय 5: कोयला और पेट्रोलियम",topic:"Coal Properties",topicHi:"कोयला के गुण",question:"कौन सा ईंधन पत्थर जैसा कठोर और काले रंग का होता है? (Which fuel is hard as stone and black in color?)",questionHi:"कौन सा ईंधन पत्थर जैसा कठोर और काले रंग का होता है?",options:[{id:"A",text:"Petroleum",textHi:"पेट्रोलियम"},{id:"B",text:"Natural Gas",textHi:"प्राकृतिक गैस"},{id:"C",text:"Coal",textHi:"कोयला"},{id:"D",text:"Charcoal",textHi:"चारकोल"}],correctAnswer:"C",marks:1,explanation:"कोयला पत्थर जैसा कठोर और काले रंग का ठोस जीवाश्म ईंधन होता है जिसका उपयोग ताप बिजली घरों और उद्योगों में होता है।",explanationHi:"कोयला पत्थर जैसा कठोर और काले रंग का ठोस जीवाश्म ईंधन होता है जिसका उपयोग ताप बिजली घरों और उद्योगों में होता है।"},{id:23,chapter:"Chapter 5: Coal and Petroleum",chapterHi:"अध्याय 5: कोयला और पेट्रोलियम",topic:"Combustion of Coal",topicHi:"कोयले का दहन",question:"वायु में गर्म करने पर कोयला मुख्य रूप से कौन सी गैस उत्पन्न करता है? (On heating in air, coal mainly produces which gas?)",questionHi:"वायु में गर्म करने पर कोयला मुख्य रूप से कौन सी गैस उत्पन्न करता है?",options:[{id:"A",text:"Carbon monoxide",textHi:"कार्बन मोनोऑक्साइड"},{id:"B",text:"Methane",textHi:"मीथेन"},{id:"C",text:"Sulphur dioxide",textHi:"सल्फर डाइऑक्साइड"},{id:"D",text:"Carbon dioxide",textHi:"कार्बन डाइऑक्साइड"}],correctAnswer:"D",marks:1,explanation:"वायु में गर्म करने पर कोयला जलता है और मुख्य रूप से कार्बन डाइऑक्साइड गैस (CO₂) उत्पन्न करता है (C + O₂ → CO₂)।",explanationHi:"वायु में गर्म करने पर कोयला जलता है और मुख्य रूप से कार्बन डाइऑक्साइड गैस (CO₂) उत्पन्न करता है (C + O₂ → CO₂)।"},{id:24,chapter:"Chapter 5: Coal and Petroleum",chapterHi:"अध्याय 5: कोयला और पेट्रोलियम",topic:"Products of Coal Processing",topicHi:"कोयले के प्रक्रमण से उत्पाद",question:"उद्योग में कोयले के प्रक्रमण से क्या प्राप्त किया जाता है? (What is obtained by processing coal in industry?)",questionHi:"उद्योग में कोयले के प्रक्रमण से क्या प्राप्त किया जाता है?",options:[{id:"A",text:"Coke",textHi:"कोक"},{id:"B",text:"Coal tar",textHi:"कोलतार"},{id:"C",text:"Coal gas",textHi:"कोयला-गैस"},{id:"D",text:"All of the above",textHi:"उपरोक्त सभी"}],correctAnswer:"D",marks:1,explanation:"उद्योग में कोयले के प्रक्रमण द्वारा कोक, कोलतार तथा कोयला-गैस प्राप्त की जाती है। अतः 'उपरोक्त सभी' सही उत्तर है।",explanationHi:"उद्योग में कोयले के प्रक्रमण द्वारा कोक, कोलतार तथा कोयला-गैस प्राप्त की जाती है। अतः 'उपरोक्त सभी' सही उत्तर है।"},{id:25,chapter:"Chapter 5: Coal and Petroleum",chapterHi:"अध्याय 5: कोयला और पेट्रोलियम",topic:"Pure Form of Carbon",topicHi:"कार्बन का शुद्ध रूप",question:"कार्बन का लगभग शुद्ध रूप कौन सा है? (Which is an almost pure form of carbon?)",questionHi:"कार्बन का लगभग शुद्ध रूप कौन सा है?",options:[{id:"A",text:"Coal tar",textHi:"कोलतार"},{id:"B",text:"Bitumen",textHi:"बिटुमेन"},{id:"C",text:"Coke",textHi:"कोक"},{id:"D",text:"Petroleum",textHi:"पेट्रोलियम"}],correctAnswer:"C",marks:1,explanation:"कोक (Coke) एक कठोर, सरंध्र और काला पदार्थ है जो कार्बन का लगभग शुद्ध रूप होता है। इसका उपयोग इस्पात निर्माण में होता है।",explanationHi:"कोक (Coke) एक कठोर, सरंध्र और काला पदार्थ है जो कार्बन का लगभग शुद्ध रूप होता है। इसका उपयोग इस्पात निर्माण में होता है।"},{id:26,chapter:"Chapter 7: Conservation of Plants and Animals",chapterHi:"अध्याय 7: पौधे एवं जंतुओं का संरक्षण",topic:"Red Data Book",topicHi:"रेड डाटा पुस्तक",question:"वह पुस्तक जिसमें सभी संकटापन्न स्पीशीज़ का रिकार्ड रखा जाता है, क्या कहलाती है? (Book keeping record of endangered species?)",questionHi:"वह पुस्तक जिसमें सभी संकटापन्न स्पीशीज़ का रिकार्ड रखा जाता है, क्या कहलाती है?",options:[{id:"A",text:"Green Data Book",textHi:"ग्रीन डाटा पुस्तक"},{id:"B",text:"Yellow Data Book",textHi:"येलो डाटा पुस्तक"},{id:"C",text:"Red Data Book",textHi:"रेड डाटा पुस्तक"},{id:"D",text:"Blue Data Book",textHi:"ब्लू डाटा पुस्तक"}],correctAnswer:"C",marks:1,explanation:"रेड डाटा पुस्तक (Red Data Book) वह स्रोत पुस्तक है जिसमें सभी संकटापन्न (Endangered) स्पीशीज़ का आधिकारिक रिकॉर्ड रखा जाता है।",explanationHi:"रेड डाटा पुस्तक (Red Data Book) वह स्रोत पुस्तक है जिसमें सभी संकटापन्न (Endangered) स्पीशीज़ का आधिकारिक रिकॉर्ड रखा जाता है।"},{id:27,chapter:"Chapter 7: Conservation of Plants and Animals",chapterHi:"अध्याय 7: पौधे एवं जंतुओं का संरक्षण",topic:"Endemic Species",topicHi:"विशेष क्षेत्री स्पीशीज़",question:"पौधों एवं जन्तुओं की वह स्पीशीज़ जो किसी विशेष क्षेत्र में विशिष्ट रूप से पाई जाती है, उसे क्या कहते हैं? (Species found exclusively in a particular area?)",questionHi:"पौधों एवं जन्तुओं की वह स्पीशीज़ जो किसी विशेष क्षेत्र में विशिष्ट रूप से पाई जाती है, उसे क्या कहते हैं?",options:[{id:"A",text:"Extinct species",textHi:"विलुप्त स्पीशीज़"},{id:"B",text:"Endemic species",textHi:"विशेष क्षेत्री स्पीशीज़"},{id:"C",text:"Migratory species",textHi:"प्रवासी स्पीशीज़"},{id:"D",text:"Endangered species",textHi:"संकटापन्न स्पीशीज़"}],correctAnswer:"B",marks:1,explanation:"पौधों एवं जन्तुओं की वह स्पीशीज़ जो किसी विशेष क्षेत्र में विशिष्ट रूप से पाई जाती है, उसे विशेष क्षेत्री स्पीशीज़ (Endemic Species) कहते हैं।",explanationHi:"पौधों एवं जन्तुओं की वह स्पीशीज़ जो किसी विशेष क्षेत्र में विशिष्ट रूप से पाई जाती है, उसे विशेष क्षेत्री स्पीशीज़ (Endemic Species) कहते हैं।"},{id:28,chapter:"Chapter 7: Conservation of Plants and Animals",chapterHi:"अध्याय 7: पौधे एवं जंतुओं का संरक्षण",topic:"First Reserve Forest of India",topicHi:"भारत का प्रथम आरक्षित वन",question:"भारत का प्रथम आरक्षित वन कौन सा है? (Which is the first reserve forest of India?)",questionHi:"भारत का प्रथम आरक्षित वन कौन सा है?",options:[{id:"A",text:"Kaziranga National Park",textHi:"काजीरंगा राष्ट्रीय उद्यान"},{id:"B",text:"Bharatpur Sanctuary",textHi:"भरतपुर अभ्यारण्य"},{id:"C",text:"Satpura National Park",textHi:"सतपुड़ा राष्ट्रीय उद्यान"},{id:"D",text:"Pachmarhi Sanctuary",textHi:"पचमढ़ी अभ्यारण्य"}],correctAnswer:"C",marks:1,explanation:"सतपुड़ा राष्ट्रीय उद्यान (Satpura National Park) भारत का प्रथम आरक्षित वन है, जहाँ बेहतरीन टीक (सागौन) की लकड़ी पाई जाती है।",explanationHi:"सतपुड़ा राष्ट्रीय उद्यान (Satpura National Park) भारत का प्रथम आरक्षित वन है, जहाँ बेहतरीन टीक (सागौन) की लकड़ी पाई जाती है।"},{id:29,chapter:"Chapter 7: Conservation of Plants and Animals",chapterHi:"अध्याय 7: पौधे एवं जंतुओं का संरक्षण",topic:"Deforestation",topicHi:"वनोन्मूलन",question:"वनों को समाप्त करने पर प्राप्त भूमि का अन्य कार्यों में उपयोग करना क्या कहलाता है? (Clearing of forests and using land for other purposes?)",questionHi:"वनों को समाप्त करने पर प्राप्त भूमि का अन्य कार्यों में उपयोग करना क्या कहलाता है?",options:[{id:"A",text:"Desertification",textHi:"मरुस्थलीकरण"},{id:"B",text:"Deforestation",textHi:"वनोन्मूलन"},{id:"C",text:"Reforestation",textHi:"वृक्षारोपण"},{id:"D",text:"Agriculture",textHi:"कृषि"}],correctAnswer:"B",marks:1,explanation:"वनों को समाप्त करने और प्राप्त भूमि का अन्य कार्यों (जैसे कृषि, घर, कारखाने) में उपयोग करने को वनोन्मूलन (Deforestation) कहते हैं।",explanationHi:"वनों को समाप्त करने और प्राप्त भूमि का अन्य कार्यों (जैसे कृषि, घर, कारखाने) में उपयोग करने को वनोन्मूलन (Deforestation) कहते हैं।"},{id:30,chapter:"Chapter 7: Conservation of Plants and Animals",chapterHi:"अध्याय 7: पौधे एवं जंतुओं का संरक्षण",topic:"Natural Causes of Deforestation",topicHi:"वनोन्मूलन के प्राकृतिक कारण",question:"इनमें से कौन वनोन्मूलन का प्राकृतिक कारक है? (Which of these is a natural cause of deforestation?)",questionHi:"इनमें से कौन वनोन्मूलन का प्राकृतिक कारक है?",options:[{id:"A",text:"Land for agriculture",textHi:"कृषि के लिए भूमि"},{id:"B",text:"Building factories",textHi:"कारखानों का निर्माण"},{id:"C",text:"Forest fires and severe drought",textHi:"दावानल एवं भीषण सूखा"},{id:"D",text:"Making furniture",textHi:"फर्नीचर बनाना"}],correctAnswer:"C",marks:1,explanation:"दावानल (जंगल की भीषण आग) एवं भीषण सूखा वनोन्मूलन के प्राकृतिक कारक हैं, जबकि अन्य मानव-निर्मित कारक हैं।",explanationHi:"दावानल (जंगल की भीषण आग) एवं भीषण सूखा वनोन्मूलन के प्राकृतिक कारक हैं, जबकि अन्य मानव-निर्मित कारक हैं।"},{id:31,chapter:"Chapter 7: Conservation of Plants and Animals",chapterHi:"अध्याय 7: पौधे एवं जंतुओं का संरक्षण",topic:"Deforestation and Atmosphere",topicHi:"वनोन्मूलन एवं वायुमंडल",question:"वनोन्मूलन से वायुमण्डल में किस गैस का स्तर बढ़ता है? (Deforestation causes increase in level of which gas?)",questionHi:"वनोन्मूलन से वायुमण्डल में किस गैस का स्तर बढ़ता है?",options:[{id:"A",text:"Oxygen",textHi:"ऑक्सीजन"},{id:"B",text:"Nitrogen",textHi:"नाइट्रोजन"},{id:"C",text:"Carbon dioxide",textHi:"कार्बन डाइऑक्साइड"},{id:"D",text:"Ozone",textHi:"ओजोन"}],correctAnswer:"C",marks:1,explanation:"पेड़ प्रकाश संश्लेषण में CO₂ का उपयोग करते हैं। पेड़ों की कटाई से वातावरण में कार्बन डाइऑक्साइड (CO₂) की मात्रा बढ़ जाती है।",explanationHi:"पेड़ प्रकाश संश्लेषण में CO₂ का उपयोग करते हैं। पेड़ों की कटाई से वातावरण में कार्बन डाइऑक्साइड (CO₂) की मात्रा बढ़ जाती है।"},{id:32,chapter:"Chapter 7: Conservation of Plants and Animals",chapterHi:"अध्याय 7: पौधे एवं जंतुओं का संरक्षण",topic:"Global Warming",topicHi:"ग्लोबल वार्मिंग (विश्व ऊष्णन)",question:"वायुमण्डल में कार्बन डाइऑक्साइड की मात्रा बढ़ने से क्या होता है? (What happens when CO2 increases in atmosphere?)",questionHi:"वायुमण्डल में कार्बन डाइऑक्साइड की मात्रा बढ़ने से क्या होता है?",options:[{id:"A",text:"Cooling",textHi:"शीतलन"},{id:"B",text:"Global Warming",textHi:"विश्व ऊष्णन (ग्लोबल वार्मिंग)"},{id:"C",text:"Increase in rainfall",textHi:"वर्षा में वृद्धि"},{id:"D",text:"Decrease in soil erosion",textHi:"मृदा अपरदन में कमी"}],correctAnswer:"B",marks:1,explanation:"कार्बन डाइऑक्साइड ऊष्मीय विकिरणों को अवशोषित करती है, जिससे पृथ्वी के तापमान में वृद्धि होती है जिसे विश्व ऊष्णन (Global Warming) कहते हैं।",explanationHi:"कार्बन डाइऑक्साइड ऊष्मीय विकिरणों को अवशोषित करती है, जिससे पृथ्वी के तापमान में वृद्धि होती है जिसे विश्व ऊष्णन (Global Warming) कहते हैं।"},{id:33,chapter:"Chapter 7: Conservation of Plants and Animals",chapterHi:"अध्याय 7: पौधे एवं जंतुओं का संरक्षण",topic:"Desertification",topicHi:"मरुस्थलीकरण",question:"मृदा की ऊपरी परत हटने से नीचे की कठोर चट्टानें दिखाई देने लगती हैं, इससे धीरे-धीरे उर्वर भूमि किसमें बदल जाती है? (Fertile land gradually converts into?)",questionHi:"मृदा की ऊपरी परत हटने से नीचे की कठोर चट्टानें दिखाई देने लगती हैं, इससे धीरे-धीरे उर्वर भूमि किसमें बदल जाती है?",options:[{id:"A",text:"Swamp",textHi:"दलदल"},{id:"B",text:"Pasture",textHi:"चारागाह"},{id:"C",text:"Desert",textHi:"मरुस्थल"},{id:"D",text:"Forest",textHi:"वन"}],correctAnswer:"C",marks:1,explanation:"मृदा अपरदन से उर्वर परत हट जाती है और उपजाऊ भूमि धीरे-धीरे मरुस्थल में परिवर्तित हो जाती है, जिसे मरुस्थलीकरण (Desertification) कहते हैं।",explanationHi:"मृदा अपरदन से उर्वर परत हट जाती है और उपजाऊ भूमि धीरे-धीरे मरुस्थल में परिवर्तित हो जाती है, जिसे मरुस्थलीकरण (Desertification) कहते हैं।"},{id:34,chapter:"Chapter 7: Conservation of Plants and Animals",chapterHi:"अध्याय 7: पौधे एवं जंतुओं का संरक्षण",topic:"Biodiversity",topicHi:"जैव विविधता की परिभाषा",question:"पृथ्वी पर पाए जाने वाले विभिन्न जीवों की प्रजातियाँ और उनके पारस्परिक संबंध क्या क
