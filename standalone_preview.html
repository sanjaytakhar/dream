 वेग से 45° के कोण पर प्रक्षेपित किया जाता है। प्राप्त अधिकतम ऊंचाई होगी: (मानें g = 10 m/s²)",options:[{id:"A",text:"10 m",textHi:"10 मीटर"},{id:"B",text:"20 m",textHi:"20 मीटर"},{id:"C",text:"15 m",textHi:"15 मीटर"},{id:"D",text:"5 m",textHi:"5 मीटर"}],correctAnswer:"A",marks:4,negativeMarks:0,explanation:"Maximum height H = (u² sin²θ) / (2g). Here u = 20 m/s, θ = 45°, and g = 10 m/s². Therefore, H = (400 × 0.5) / 20 = 200 / 20 = 10 m.",explanationHi:"अधिकतम ऊंचाई H = (u² sin²θ) / (2g)। यहाँ u = 20 m/s, θ = 45°, और g = 10 m/s²। अतः H = (400 × 0.5) / 20 = 10 मीटर।",timeEstimate:"42s"},{id:2,section:"Section A - Science",topic:"Light & Optics (Class 10)",classLevel:"Class 10",question:"A convex lens has a focal length of 20 cm. At what distance from the lens should an object be placed to form a real, inverted image of the same size?",questionHi:"एक उत्तल लेंस की फोकस दूरी 20 सेमी है। लेंस से कितनी दूरी पर वस्तु को रखा जाए ताकि उसी आकार का वास्तविक एवं उल्टा प्रतिबिंब बने?",options:[{id:"A",text:"10 cm",textHi:"10 सेमी"},{id:"B",text:"20 cm",textHi:"20 सेमी"},{id:"C",text:"40 cm (at 2F)",textHi:"40 सेमी (2F पर)"},{id:"D",text:"60 cm",textHi:"60 सेमी"}],correctAnswer:"C",marks:4,negativeMarks:0,explanation:"For a convex lens, when an object is placed at 2F (twice the focal length = 2 × 20 cm = 40 cm), the image formed is real, inverted, and of the exact same size as the object.",explanationHi:"उत्तल लेंस के लिए जब वस्तु 2F (फोकस दूरी का दोगुना = 2 × 20 = 40 सेमी) पर होती है, तब प्रतिबिंब समान आकार का वास्तविक और उल्टा बनता है।",timeEstimate:"45s"},{id:3,section:"Section A - Mathematics",topic:"Linear Equations & Polynomials",classLevel:"Class 9-10",question:"If α and β are the zeroes of the quadratic polynomial P(x) = x² - 5x + 6, the value of (α + β) is:",questionHi:"यदि α तथा β द्विघात बहुपद P(x) = x² - 5x + 6 के शून्यक हैं, तो (α + β) का मान होगा:",options:[{id:"A",text:"6",textHi:"6"},{id:"B",text:"-5",textHi:"-5"},{id:"C",text:"5",textHi:"5"},{id:"D",text:"-6",textHi:"-6"}],correctAnswer:"C",marks:4,negativeMarks:0,explanation:"For ax² + bx + c = 0, sum of roots α + β = -b/a = -(-5)/1 = 5.",explanationHi:"द्विघात बहुपद में शून्यकों का योग α + β = -b/a = -(-5)/1 = 5 होता है।",timeEstimate:"30s"},{id:4,section:"Section A - Science",topic:"Cell Structure & Functions",classLevel:"Class 8-10",question:'Which cell organelle is known as the "Powerhouse of the Cell"?',questionHi:'किस कोशिकांग को "कोशिका का शक्तिगृह (पावरहाउस)" कहा जाता है?',options:[{id:"A",text:"Ribosome",textHi:"राइबोसोम"},{id:"B",text:"Golgi Apparatus",textHi:"गॉल्जी काय"},{id:"C",text:"Endoplasmic Reticulum",textHi:"अंतःप्रद्रव्यी जालिका"},{id:"D",text:"Mitochondria",textHi:"माइटोकॉन्ड्रिया"}],correctAnswer:"D",marks:4,negativeMarks:0,explanation:"Mitochondria produce cellular energy in the form of ATP, hence known as the powerhouse of the cell.",explanationHi:"माइटोकॉन्ड्रिया एटीपी (ATP) के रूप में ऊर्जा का उत्पादन करते हैं, इसलिए इन्हें कोशिका का बिजलीघर कहते हैं।",timeEstimate:"20s"},{id:5,section:"Section A - Mathematics",topic:"Geometry & Mensuration",classLevel:"Class 6-8",question:"The perimeter of a rectangular school playground is 120 meters. If its length is 40 meters, its breadth is:",questionHi:"विद्यालय के एक आयताकार खेल के मैदान का परिमाप 120 मीटर है। यदि इसकी लंबाई 40 मीटर है, तो चौड़ाई होगी:",options:[{id:"A",text:"10 meters",textHi:"10 मीटर"},{id:"B",text:"20 meters",textHi:"20 मीटर"},{id:"C",text:"30 meters",textHi:"30 मीटर"},{id:"D",text:"25 meters",textHi:"25 मीटर"}],correctAnswer:"B",marks:4,negativeMarks:0,explanation:"Perimeter = 2(Length + Breadth) ⇒ 120 = 2(40 + B) ⇒ 60 = 40 + B ⇒ B = 20 meters.",explanationHi:"परिमाप = 2(लंबाई + चौड़ाई) ⇒ 120 = 2(40 + B) ⇒ 60 = 40 + B ⇒ B = 20 मीटर।",timeEstimate:"25s"}],ne={name:"Arjun Sharma",nameHi:"अर्जुन शर्मा",schoolName:"GSSS 52 LNP (MANJHUWAS)",schoolNameHi:"रा.उ.मा.वि. 52 एलएनपी (मांझूवास)",admissionNo:"GSSS52-2024-892",grade:"Class 10 - Section A",gradeHi:"कक्षा 10 - वर्ग अ",email:"arjun.52ln
